<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- BIZ UDPGothic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <title>きっぷゴー</title>

  <style>

    * {
      box-sizing: border-box;
    }


    /* =========================
       全体
       ========================= */

    body {
      margin: 0;

      font-family:
        "BIZ UDPGothic",
        sans-serif;

      background: #f5f9ff;

      color: #222;
    }


    /* =========================
       ヘッダー
       ========================= */

    header {
      position: relative;

      height: 150px;

      background: #b9f5df;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;
    }


    /*
     * 添付画像のような
     * 濃い緑の横帯
     */

    header::after {
      content: "";

      position: absolute;

      left: 0;
      right: 0;

      bottom: 0;

      height: 38px;

      background: #62c45d;
    }


    .logo {
      position: relative;

      z-index: 1;

      font-size: 32px;

      font-weight: bold;

      letter-spacing: 2px;

      color: #1677d2;

      margin-bottom: 30px;
    }


    /* =========================
       メイン
       ========================= */

    main {
      max-width: 1000px;

      margin: 0 auto;

      padding: 35px 20px 60px;
    }


    /* =========================
       ようこそ
       ========================= */

    .welcome {
      width: 100%;

      text-align: center;

      font-size: 32px;

      margin: 0 auto 45px;

      color: #1265b5;

      font-weight: bold;
    }


    /* =========================
       見出し
       ========================= */

    h2 {
      width: 100%;

      text-align: center;

      margin: 0 auto 25px;

      font-weight: bold;
    }


    /* =========================
       検索ボックス
       ========================= */

    .search-box {
      background: white;

      border-radius: 15px;

      padding: 25px;

      box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.08);
    }


    .search-row {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 15px;
    }


    .form-group {
      display: flex;

      flex-direction: column;

      gap: 7px;
    }


    label {
      font-weight: bold;

      font-size: 14px;
    }


    select {
      width: 100%;

      padding: 12px;

      border:
        1px solid #c9d6e5;

      border-radius: 8px;

      background: white;

      font-size: 15px;

      font-family:
        "BIZ UDPGothic",
        sans-serif;
    }


    /* =========================
       追加項目
       ========================= */

    .option-row {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 15px;

      margin-top: 15px;
    }


    /* =========================
       曜日
       ========================= */

    .weekday-area {
      margin-top: 20px;

      padding: 18px;

      background: #f5f8fc;

      border-radius: 10px;
    }


    .weekday-title {
      font-weight: bold;

      margin-bottom: 12px;
    }


    .weekday-list {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;
    }


    .weekday-list label {
      background: white;

      border:
        1px solid #ccd8e5;

      border-radius: 7px;

      padding: 8px 12px;

      cursor: pointer;

      font-weight: normal;
    }


    .weekday-list input {
      margin-right: 5px;
    }


    /* =========================
       曜日の文字色
       ========================= */

    /* 土曜日：青 */

    .weekday-saturday {
      color: #1677d2;
      font-weight: bold !important;
    }


    /* 日曜日：赤 */

    .weekday-sunday {
      color: #e53935;
      font-weight: bold !important;
    }


    /* 祝日：赤 */

    .weekday-holiday {
      color: #e53935;
      font-weight: bold !important;
    }


    /* =========================
       検索ボタン
       ========================= */

    .search-button-area {
      text-align: center;

      margin-top: 25px;
    }


    .search-button {
      width: 70px;

      height: 70px;

      border: none;

      border-radius: 50%;

      background: #1677d2;

      cursor: pointer;

      position: relative;

      transition: 0.2s;

      overflow: hidden;
    }


    .search-button:hover {
      background: #0e61ad;

      transform: scale(1.05);
    }


    /* =========================
       虫めがね
       ========================= */

    .search-button::before {
      content: "";

      position: absolute;

      width: 24px;

      height: 24px;

      border:
        4px solid white;

      border-radius: 50%;

      left: 18px;

      top: 17px;
    }


    .search-button::after {
      content: "";

      position: absolute;

      width: 15px;

      height: 4px;

      background: white;

      transform: rotate(45deg);

      left: 39px;

      top: 41px;

      border-radius: 3px;
    }


    /* =========================
       検索結果
       ========================= */

    #results {
      display: none;

      margin-top: 50px;
    }


    .result-count {
      margin-bottom: 20px;

      font-weight: bold;

      font-size: 17px;
    }


    /* =========================
       きっぷカード
       ========================= */

    .ticket-card {
      background: white;

      border:
        3px solid #222;

      border-radius: 35px;

      padding:
        45px 55px 38px;

      margin-bottom: 30px;

      box-shadow:
        0 4px 10px
        rgba(0, 0, 0, 0.04);
    }


    /* =========================
       タグ
       ========================= */

    .ticket-tags {
      display: flex;

      flex-wrap: wrap;

      gap: 18px;

      margin-bottom: 50px;
    }


    .ticket-tag {
      color: white;

      padding:
        18px 25px;

      border-radius: 14px;

      font-size: 24px;

      font-weight: bold;

      line-height: 1.2;
    }


    .company-tag {
      background: #f28c00;
    }


    .company-tag:nth-child(2) {
      background: #315bea;
    }


    .company-tag:nth-child(3) {
      background: #7b55d9;
    }


    .type-tag {
      background: #62c45d;
    }


    .weekday-tag {
      background: #ee4d40;
    }


    /* =========================
       きっぷ名・価格
       ========================= */

    .ticket-title-row {
      display: flex;

      align-items: baseline;

      flex-wrap: wrap;

      gap: 25px;

      margin-bottom: 35px;
    }


    .ticket-name {
      font-size: 56px;

      font-weight: bold;

      line-height: 1.2;

      color: #111;
    }


    .ticket-price {
      font-size: 38px;

      white-space: nowrap;
    }


    /* =========================
       説明
       ========================= */

    .ticket-description {
      font-size: 21px;

      line-height: 1.7;

      margin-bottom: 40px;
    }


    /* =========================
       詳細
       ========================= */

    .ticket-details {
      font-size: 16px;

      line-height: 1.8;

      color: #444;

      margin-bottom: 25px;
    }


    /* =========================
       公式サイト
       ========================= */

    .official-link {
      display: inline-block;

      color: #555;

      font-size: 19px;

      text-decoration: underline;

      font-weight: normal;
    }


    .official-link:hover {
      color: #1677d2;
    }


    /* =========================
       0件
       ========================= */

    .no-result {
      background: white;

      padding: 30px;

      text-align: center;

      border-radius: 15px;

      color: #666;
    }


    /* =========================
       エラー
       ========================= */

    .data-error {
      background: #fff0f0;

      border:
        2px solid #e53935;

      border-radius: 12px;

      padding: 20px;

      color: #b71c1c;

      text-align: center;
    }


    /* =========================
       スマホ
       ========================= */

    @media (max-width: 700px) {

      header {
        height: 120px;
      }


      header::after {
        height: 30px;
      }


      .logo {
        font-size: 26px;

        margin-bottom: 24px;
      }


      .search-row {
        grid-template-columns: 1fr;
      }


      .option-row {
        grid-template-columns: 1fr;
      }


      .welcome {
        font-size: 26px;
      }


      .ticket-card {
        padding:
          25px 20px 25px;

        border-radius: 25px;
      }


      .ticket-tags {
        gap: 8px;

        margin-bottom: 30px;
      }


      .ticket-tag {
        font-size: 15px;

        padding:
          10px 13px;

        border-radius: 9px;
      }


      .ticket-title-row {
        gap: 10px;

        margin-bottom: 20px;
      }


      .ticket-name {
        font-size: 34px;
      }


      .ticket-price {
        font-size: 25px;
      }


      .ticket-description {
        font-size: 16px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       ヘッダー
       ========================= -->

  <header>

    <div class="logo">
      きっぷゴー
    </div>

  </header>



  <main>


    <!-- =========================
         ようこそ
         ========================= -->

    <div class="welcome">
      きっぷゴーへようこそ！
    </div>



    <!-- =========================
         検索
         ========================= -->

    <h2>
      お得なきっぷを検索する
    </h2>


    <div class="search-box">


      <!-- エリア・社局 -->

      <div class="search-row">


        <!-- エリア -->

        <div class="form-group">

          <label for="area">
            エリア
          </label>


          <select id="area">

            <option value="">
              指定なし
            </option>

            <option value="北海道">
              北海道
            </option>

            <option value="東北">
              東北
            </option>

            <option value="関東甲信">
              関東甲信
            </option>

            <option value="北陸">
              北陸
            </option>

            <option value="東海4県">
              東海4県
            </option>

            <option value="関西">
              関西
            </option>

            <option value="中国">
              中国
            </option>

            <option value="四国">
              四国
            </option>

            <option value="九州・沖縄">
              九州・沖縄
            </option>

          </select>

        </div>



        <!-- 社局 -->

        <div class="form-group">

          <label for="company">
            社局名
          </label>


          <select id="company">

            <option value="">
              指定なし
            </option>

          </select>

        </div>

      </div>



      <!-- =========================
           きっぷ種類・媒体
           ========================= -->

      <div class="option-row">


        <!-- きっぷの種類 -->

        <div class="form-group">

          <label for="ticketType">
            きっぷの種類
          </label>


          <select id="ticketType">

            <option value="">
              指定なし
            </option>

            <option value="回数券">
              回数券
            </option>

            <option value="フリーパス">
              フリーパス
            </option>

            <option value="往復">
              往復
            </option>

          </select>

        </div>



        <!-- 媒体 -->

        <div class="form-group">

          <label for="media">
            媒体
          </label>


          <select id="media">

            <option value="">
              指定なし
            </option>

            <option value="紙">
              紙
            </option>

            <option value="デジタル">
              デジタル
            </option>

          </select>

        </div>

      </div>



      <!-- =========================
           曜日
           ========================= -->

      <div class="weekday-area">


        <div class="weekday-title">
          利用できる曜日
        </div>


        <div class="weekday-list">


          <label>
            <input
              type="checkbox"
              value="月"
            >
            月
          </label>


          <label>
            <input
              type="checkbox"
              value="火"
            >
            火
          </label>


          <label>
            <input
              type="checkbox"
              value="水"
            >
            水
          </label>


          <label>
            <input
              type="checkbox"
              value="木"
            >
            木
          </label>


          <label>
            <input
              type="checkbox"
              value="金"
            >
            金
          </label>


          <label class="weekday-saturday">
            <input
              type="checkbox"
              value="土"
            >
            土
          </label>


          <label class="weekday-sunday">
            <input
              type="checkbox"
              value="日"
            >
            日
          </label>


          <label class="weekday-holiday">
            <input
              type="checkbox"
              value="祝"
            >
            祝
          </label>


        </div>

      </div>



      <!-- =========================
           検索ボタン
           ========================= -->

      <div class="search-button-area">


        <button
          class="search-button"
          id="searchButton"
          aria-label="検索"
        ></button>


      </div>


    </div>



    <!-- =========================
         検索結果
         ========================= -->

    <section id="results">


      <h2>
        検索結果
      </h2>


      <div
        id="resultCount"
        class="result-count"
      ></div>


      <div id="resultList"></div>


    </section>


  </main>



  <script>


    /* =========================
       エリア → 社局
       ========================= */

    const companiesByArea = {

      "北海道": [
        "JR北海道"
      ],

      "東北": [
        "JR東日本",
        "仙台市交通局"
      ],

      "関東甲信": [
        "JR東日本",
        "東武",
        "西武",
        "京成",
        "小田急",
        "東急",
        "京王",
        "東京メトロ",
        "都営地下鉄"
      ],

      "北陸": [
        "JR西日本",
        "IRいしかわ鉄道",
        "あいの風とやま鉄道",
        "ハピラインふくい"
      ],

      "東海4県": [
        "JR東海",
        "名古屋鉄道",
        "近鉄",
        "名古屋市交通局",
        "静岡鉄道",
        "伊勢鉄道"
      ],

      "関西": [
        "JR西日本",
        "近鉄",
        "阪急",
        "阪神",
        "南海",
        "京阪",
        "大阪メトロ",
        "山陽電鉄"
      ],

      "中国": [
        "JR西日本",
        "一畑電車",
        "広島電鉄"
      ],

      "四国": [
        "JR四国",
        "ことでん",
        "伊予鉄道",
        "とさでん交通"
      ],

      "九州・沖縄": [
        "JR九州",
        "西日本鉄道",
        "福岡市地下鉄",
        "沖縄都市モノレール"
      ]

    };


    /* =========================
       HTML要素
       ========================= */

    const areaSelect =
      document.getElementById("area");

    const companySelect =
      document.getElementById("company");

    const searchButton =
      document.getElementById("searchButton");

    const results =
      document.getElementById("results");

    const resultCount =
      document.getElementById("resultCount");

    const resultList =
      document.getElementById("resultList");


    /* =========================
       きっぷデータ
       tickets.json を読み込む
       ========================= */

    let tickets = [];


    async function loadTickets() {

      try {

        const response =
          await fetch("./data/tickets.json");


        if (!response.ok) {

          throw new Error(
            "きっぷデータを読み込めませんでした"
          );

        }


        const data =
          await response.json();


        tickets =
          data.tickets || [];


      } catch (error) {

        console.error(error);


        resultList.innerHTML = `

          <div class="data-error">

            きっぷデータを読み込めませんでした。<br>
            data/tickets.json が正しく配置されているか確認してください。

          </div>

        `;

        results.style.display = "block";

      }

    }


    /* =========================
       エリア変更
       ========================= */

    areaSelect.addEventListener(
      "change",
      function() {

        const selectedArea =
          this.value;


        companySelect.innerHTML = "";


        const noneOption =
          document.createElement("option");


        noneOption.value = "";

        noneOption.textContent =
          "指定なし";


        companySelect.appendChild(
          noneOption
        );


        /*
         * エリア未指定
         *
         * 全社局を表示
         */

        if (selectedArea === "") {

          const allCompanies =
            new Set();


          Object.values(
            companiesByArea
          ).forEach(
            companies => {

              companies.forEach(
                company => {

                  allCompanies.add(
                    company
                  );

                }
              );

            }
          );


          [
            ...allCompanies
          ]
            .sort()
            .forEach(
              company => {

                const option =
                  document.createElement(
                    "option"
                  );


                option.value =
                  company;


                option.textContent =
                  company;


                companySelect.appendChild(
                  option
                );

              }
            );


          return;

        }


        /*
         * エリア指定あり
         */

        const companies =
          companiesByArea[
            selectedArea
          ] || [];


        companies.forEach(
          company => {

            const option =
              document.createElement(
                "option"
              );


            option.value =
              company;


            option.textContent =
              company;


            companySelect.appendChild(
              option
            );

          }
        );

      }
    );


    /* =========================
       検索
       ========================= */

    searchButton.addEventListener(
      "click",
      searchTickets
    );


    function searchTickets() {


      const area =
        areaSelect.value;


      const company =
        companySelect.value;


      const ticketType =
        document.getElementById(
          "ticketType"
        ).value;


      const media =
        document.getElementById(
          "media"
        ).value;


      const selectedWeekdays =
        [
          ...document.querySelectorAll(
            ".weekday-list input:checked"
          )
        ].map(
          input => input.value
        );


      /* =========================
         絞り込み
         ========================= */

      const filteredTickets =
        tickets.filter(
          ticket => {


            /*
             * エリア
             */

            if (
              area !== "" &&
              !ticket.areas.includes(area)
            ) {

              return false;

            }


            /*
             * 社局
             */

            if (
              company !== "" &&
              !ticket.companies.includes(
                company
              )
            ) {

              return false;

            }


            /*
             * きっぷ種類
             */

            if (
              ticketType !== "" &&
              ticket.type !== ticketType
            ) {

              return false;

            }


            /*
             * 媒体
             */

            if (
              media !== "" &&
              ticket.medium !== media
            ) {

              return false;

            }


            /*
             * 曜日
             *
             * 選択した曜日を
             * 全部満たす必要がある
             */

            if (
              selectedWeekdays.length > 0
            ) {

              const matches =
                selectedWeekdays.every(
                  day =>
                    ticket.weekdays.includes(
                      day
                    )
                );


              if (!matches) {

                return false;

              }

            }


            return true;

          }
        );


      /* =========================
         結果表示
         ========================= */

      results.style.display =
        "block";


      resultCount.textContent =
        `${filteredTickets.length}件のきっぷが見つかりました`;


      resultList.innerHTML = "";


      /* =========================
         0件
         ========================= */

      if (
        filteredTickets.length === 0
      ) {

        resultList.innerHTML = `

          <div class="no-result">

            条件に一致する
            きっぷはありませんでした。

          </div>

        `;


        return;

      }


      /* =========================
         カード作成
         ========================= */

      filteredTickets.forEach(
        ticket => {


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "ticket-card";


          /*
           * 社局タグ
           */

          const companyTags =
            ticket.companies
              .map(
                (company, index) => `

                  <span
                    class="ticket-tag company-tag"
                  >
                    ${company}
                  </span>

                `
              )
              .join("");


          /*
           * 曜日表示
           */

          const weekdayText =
            ticket.weekdays.join("・");


          /*
           * カード内容
           */

          card.innerHTML = `

            <div class="ticket-tags">

              ${companyTags}

              <span
                class="ticket-tag type-tag"
              >
                ${ticket.type}
              </span>

              <span
                class="ticket-tag weekday-tag"
              >
                ${weekdayText}
              </span>

            </div>


            <div
              class="ticket-title-row"
            >

              <div
                class="ticket-name"
              >
                ${ticket.name}
              </div>


              <div
                class="ticket-price"
              >
                ¥${ticket.price.adult.toLocaleString()}
              </div>

            </div>


            <div
              class="ticket-description"
            >
              ${ticket.description}
            </div>


            <div
              class="ticket-details"
            >

              媒体：
              ${ticket.medium}

              <br>

              利用エリア：
              ${ticket.usageArea}

            </div>


            <a
              class="official-link"

              href="${ticket.officialUrl}"

              target="_blank"

              rel="noopener noreferrer"
            >

              &gt;&gt;公式サイトへ

            </a>

          `;


          resultList.appendChild(
            card
          );

        }
      );

    }


    /* =========================
       ページ読み込み時
       ========================= */

    loadTickets();


  </script>


</body>
</html>
