<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- BIZ UDPGothic -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <title>きっぷゴー</title>


  <style>

    /* ==================================================
       基本
       ================================================== */

    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;

      font-family:
        "BIZ UDPGothic",
        sans-serif;

      color: #111;

      background: #ffffff;
    }


    /* ==================================================
       トップエリア
       ================================================== */

    .top-area {
      position: relative;

      min-height: 780px;

      overflow: hidden;

      background: #baf4df;
    }


    /*
     * 濃い緑の横帯
     */

    .green-band {
      position: absolute;

      left: 0;
      right: 0;

      top: 62%;

      height: 105px;

      background: #62c45d;

      z-index: 0;
    }


    /* ==================================================
       メイン
       ================================================== */

    main {
      position: relative;

      z-index: 1;

      width: min(1100px, 100%);

      margin: 0 auto;

      padding:
        90px 30px 100px;
    }


    /* ==================================================
       ようこそ
       ================================================== */

    .welcome {
      margin: 0;

      text-align: center;

      font-size:
        clamp(38px, 5vw, 64px);

      font-weight: 400;

      line-height: 1.4;
    }


    /* ==================================================
       検索パネル
       ================================================== */

    .search-panel {
      position: relative;

      z-index: 2;

      width: min(1000px, 100%);

      margin:
        105px auto 0;

      padding:
        52px 65px 58px;

      background: #ffffff;

      border:
        3px solid #111;

      border-radius: 42px;

      box-shadow:
        0 2px 0
        rgba(0, 0, 0, 0.05);
    }


    /* ==================================================
       検索タイトル
       ================================================== */

    .search-title {
      margin: 0 0 45px;

      text-align: center;

      font-size:
        clamp(28px, 4vw, 42px);

      font-weight: 700;
    }


    /* ==================================================
       検索行
       ================================================== */

    .search-row {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 24px;

      margin-bottom: 24px;
    }


    .form-group {
      display: flex;

      flex-direction: column;

      gap: 9px;
    }


    .form-group label {
      font-size: 17px;

      font-weight: 700;
    }


    /* ==================================================
       セレクト
       ================================================== */

    select {
      width: 100%;

      min-height: 58px;

      padding:
        10px 16px;

      border:
        2px solid #333;

      border-radius: 10px;

      background: #ffffff;

      color: #111;

      font-family:
        "BIZ UDPGothic",
        sans-serif;

      font-size: 17px;

      cursor: pointer;
    }


    select:focus {
      outline:
        3px solid
        rgba(22, 119, 210, 0.25);

      border-color: #1677d2;
    }


    /* ==================================================
       曜日
       ================================================== */

    .weekday-area {
      margin-top: 34px;
    }


    .weekday-title {
      margin-bottom: 17px;

      text-align: center;

      font-size: 20px;

      font-weight: 700;
    }


    .weekday-list {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 10px;
    }


    .weekday-list label {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-width: 65px;

      min-height: 52px;

      padding:
        8px 13px;

      border:
        2px solid #333;

      border-radius: 9px;

      background: #ffffff;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;

      user-select: none;

      transition:
        background 0.15s,
        transform 0.15s;
    }


    .weekday-list label:hover {
      background: #f3f3f3;

      transform: translateY(-1px);
    }


    .weekday-list input {
      width: 17px;

      height: 17px;

      margin:
        0 7px 0 0;

      cursor: pointer;
    }


    /* ==================================================
       曜日の色
       ================================================== */

    .weekday-normal {
      color: #111;
    }


    .weekday-saturday {
      color: #1677d2 !important;
    }


    .weekday-sunday {
      color: #e53935 !important;
    }


    .weekday-holiday {
      color: #e53935 !important;
    }


    /* ==================================================
       検索ボタン
       ================================================== */

    .search-button-area {
      display: flex;

      justify-content: center;

      margin-top: 40px;
    }


    .search-button {
      position: relative;

      width: 76px;

      height: 76px;

      padding: 0;

      border: none;

      border-radius: 50%;

      background: #1677d2;

      cursor: pointer;

      overflow: hidden;

      transition:
        background 0.15s,
        transform 0.15s;
    }


    .search-button:hover {
      background: #0f62b0;

      transform: scale(1.05);
    }


    .search-button:active {
      transform: scale(0.97);
    }


    /*
     * 虫めがねの丸
     */

    .search-button::before {
      content: "";

      position: absolute;

      width: 25px;

      height: 25px;

      left: 21px;

      top: 18px;

      border:
        4px solid #ffffff;

      border-radius: 50%;
    }


    /*
     * 虫めがねの持ち手
     */

    .search-button::after {
      content: "";

      position: absolute;

      width: 17px;

      height: 4px;

      left: 43px;

      top: 44px;

      background: #ffffff;

      border-radius: 4px;

      transform:
        rotate(45deg);

      transform-origin:
        left center;
    }


    /* ==================================================
       検索結果
       ================================================== */

    #results {
      display: none;

      width: 100%;

      background: #ffffff;

      padding:
        70px 30px 100px;
    }


    .results-inner {
      width: min(1000px, 100%);

      margin: 0 auto;
    }


    #results h2 {
      margin:
        0 0 25px;

      text-align: center;

      font-size: 34px;
    }


    .result-count {
      margin-bottom: 20px;

      font-size: 18px;

      font-weight: 700;
    }


    /* ==================================================
       きっぷカード
       ================================================== */

    .ticket-card {
      margin-bottom: 28px;

      padding:
        38px 45px;

      background: #ffffff;

      border:
        3px solid #111;

      border-radius: 32px;

      box-shadow:
        0 4px 10px
        rgba(0, 0, 0, 0.05);
    }


    .ticket-tags {
      display: flex;

      flex-wrap: wrap;

      gap: 10px;

      margin-bottom: 28px;
    }


    .ticket-tag {
      display: inline-block;

      padding:
        10px 15px;

      border-radius: 10px;

      color: #ffffff;

      font-size: 16px;

      font-weight: 700;
    }


    .company-tag {
      background: #f28c00;
    }


    .company-tag:nth-child(2) {
      background: #315bea;
    }


    .company-tag:nth-child(3) {
      background: #7b55d9;
    }


    .type-tag {
      background: #62c45d;
    }


    .weekday-tag {
      background: #e85a4f;
    }


    .ticket-title-row {
      display: flex;

      align-items: baseline;

      flex-wrap: wrap;

      gap: 20px;

      margin-bottom: 25px;
    }


    .ticket-name {
      font-size:
        clamp(30px, 5vw, 52px);

      font-weight: 700;

      line-height: 1.3;
    }


    .ticket-price {
      font-size: 30px;

      font-weight: 700;

      white-space: nowrap;
    }


    .ticket-description {
      margin-bottom: 25px;

      font-size: 18px;

      line-height: 1.8;
    }


    .ticket-details {
      margin-bottom: 22px;

      color: #444;

      font-size: 15px;

      line-height: 1.8;
    }


    .official-link {
      color: #1677d2;

      font-size: 17px;

      font-weight: 700;

      text-decoration: underline;
    }


    .official-link:hover {
      color: #0f62b0;
    }


    /* ==================================================
       検索結果 0件
       ================================================== */

    .no-result {
      padding: 40px;

      background: #ffffff;

      border:
        3px solid #111;

      border-radius: 25px;

      text-align: center;

      font-size: 18px;
    }


    /* ==================================================
       エラー
       ================================================== */

    .data-error {
      padding: 30px;

      background: #ffffff;

      border:
        3px solid #d33;

      border-radius: 20px;

      color: #b00000;

      text-align: center;

      line-height: 1.8;
    }


    /* ==================================================
       タブレット・縦画面
       ================================================== */

    @media (max-width: 800px) {

      .top-area {
        min-height: 760px;
      }


      .green-band {
        top: 62%;

        height: 95px;
      }


      main {
        padding:
          65px 18px 80px;
      }


      .welcome {
        font-size: 38px;
      }


      .search-panel {
        margin-top: 75px;

        padding:
          38px 22px 42px;

        border-radius: 30px;
      }


      .search-title {
        margin-bottom: 32px;

        font-size: 27px;
      }


      .search-row {
        grid-template-columns: 1fr;

        gap: 18px;

        margin-bottom: 18px;
      }


      .weekday-area {
        margin-top: 25px;
      }


      .weekday-list {
        gap: 7px;
      }


      .weekday-list label {
        min-width: 55px;

        min-height: 48px;

        font-size: 15px;
      }


      .search-button-area {
        margin-top: 32px;
      }


      .search-button {
        width: 68px;

        height: 68px;
      }


      .search-button::before {
        width: 22px;

        height: 22px;

        left: 18px;

        top: 17px;
      }


      .search-button::after {
        width: 16px;

        left: 39px;

        top: 41px;
      }


      #results {
        padding:
          55px 18px 80px;
      }


      .ticket-card {
        padding:
          25px 20px;

        border-radius: 25px;
      }

    }


    /* ==================================================
       横画面
       ==================================================

       ここが今回の重要ポイント。

       横画面ではミントグリーンを
       「エリア・社局名あたり」までにする。
       ================================================== */

    @media (
      orientation: landscape
    ) and (
      min-width: 700px
    ) {

      .top-area {

        /*
         * 横画面ではトップ部分を
         * 画面高さに合わせる
         */

        min-height: 650px;

        /*
         * 下は白にする
         */

        background:
          linear-gradient(
            to bottom,
            #baf4df 0,
            #baf4df 57%,
            #ffffff 57%,
            #ffffff 100%
          );
      }


      /*
       * 濃い緑の帯
       *
       * 写真の帯の位置に近づける
       */

      .green-band {

        top: 57%;

        height: 11%;

      }


      main {

        padding-top: 55px;

        padding-bottom: 70px;

      }


      .welcome {

        font-size:
          clamp(42px, 4vw, 60px);

        margin-bottom: 70px;

      }


      /*
       * 横画面では検索パネルを
       * エリア・社局名付近まで
       * ミントグリーンの中に入れる
       */

      .search-panel {

        margin-top: 0;

        padding:
          38px 55px 45px;

      }


      .search-title {

        margin-bottom: 28px;

        font-size: 32px;

      }


      .search-row {

        gap: 20px;

        margin-bottom: 18px;

      }


      .form-group label {

        font-size: 15px;

      }


      select {

        min-height: 50px;

        font-size: 15px;

      }


      /*
       * 検索結果はトップの外側に出す
       * ので完全に白
       */

      #results {

        position: relative;

        z-index: 5;

      }

    }


    /* ==================================================
       とても小さい画面
       ================================================== */

    @media (max-width: 420px) {

      .welcome {
        font-size: 30px;
      }


      .search-title {
        font-size: 23px;
      }


      .weekday-list label {
        min-width: 48px;

        padding:
          7px 8px;
      }


      .weekday-list input {
        margin-right: 4px;
      }

    }

  </style>
</head>


<body>


  <!-- ==================================================
       トップ
       ================================================== -->

  <div class="top-area">


    <!-- 濃い緑の帯 -->

    <div class="green-band"></div>


    <main>


      <!-- ==================================================
           ようこそ
           ================================================== -->

      <h1 class="welcome">
        きっぷゴーへようこそ！
      </h1>


      <!-- ==================================================
           検索パネル
           ================================================== -->

      <section class="search-panel">


        <h2 class="search-title">
          （きっぷの絞り込み）
        </h2>


        <!-- エリア・社局名 -->

        <div class="search-row">


          <div class="form-group">

            <label for="area">
              エリア
            </label>


            <select id="area">

              <option value="">
                指定なし
              </option>

              <option value="北海道">
                北海道
              </option>

              <option value="東北">
                東北
              </option>

              <option value="関東甲信">
                関東甲信
              </option>

              <option value="北陸">
                北陸
              </option>

              <option value="東海4県">
                東海4県
              </option>

              <option value="関西">
                関西
              </option>

              <option value="中国">
                中国
              </option>

              <option value="四国">
                四国
              </option>

              <option value="九州・沖縄">
                九州・沖縄
              </option>

            </select>

          </div>


          <div class="form-group">

            <label for="company">
              社局名
            </label>


            <select id="company">

              <option value="">
                指定なし
              </option>

            </select>

          </div>

        </div>


        <!-- 種類・媒体 -->

        <div class="search-row">


          <div class="form-group">

            <label for="ticketType">
              きっぷの種類
            </label>


            <select id="ticketType">

              <option value="">
                指定なし
              </option>

              <option value="回数券">
                回数券
              </option>

              <option value="フリーパス">
                フリーパス
              </option>

              <option value="往復">
                往復
              </option>

            </select>

          </div>


          <div class="form-group">

            <label for="media">
              媒体
            </label>


            <select id="media">

              <option value="">
                指定なし
              </option>

              <option value="紙">
                紙
              </option>

              <option value="デジタル">
                デジタル
              </option>

            </select>

          </div>

        </div>


        <!-- ==================================================
             曜日
             ================================================== -->

        <div class="weekday-area">


          <div class="weekday-title">
            利用できる曜日
          </div>


          <div class="weekday-list">


            <label class="weekday-normal">

              <input
                type="checkbox"
                value="月"
              >

              月

            </label>


            <label class="weekday-normal">

              <input
                type="checkbox"
                value="火"
              >

              火

            </label>


            <label class="weekday-normal">

              <input
                type="checkbox"
                value="水"
              >

              水

            </label>


            <label class="weekday-normal">

              <input
                type="checkbox"
                value="木"
              >

              木

            </label>


            <label class="weekday-normal">

              <input
                type="checkbox"
                value="金"
              >

              金

            </label>


            <label class="weekday-saturday">

              <input
                type="checkbox"
                value="土"
              >

              土

            </label>


            <label class="weekday-sunday">

              <input
                type="checkbox"
                value="日"
              >

              日

            </label>


            <label class="weekday-holiday">

              <input
                type="checkbox"
                value="祝"
              >

              祝

            </label>


          </div>

        </div>


        <!-- ==================================================
             検索ボタン
             ================================================== -->

        <div class="search-button-area">


          <button
            type="button"
            class="search-button"
            id="searchButton"
            aria-label="検索"
          ></button>


        </div>


      </section>


    </main>

  </div>



  <!-- ==================================================
       検索結果
       ================================================== -->

  <section id="results">


    <div class="results-inner">


      <h2>
        検索結果
      </h2>


      <div
        id="resultCount"
        class="result-count"
      ></div>


      <div id="resultList"></div>


    </div>


  </section>



  <script>


    /* ==================================================
       エリア → 社局
       ================================================== */

    const companiesByArea = {

      "北海道": [
        "JR北海道"
      ],

      "東北": [
        "JR東日本",
        "仙台市交通局"
      ],

      "関東甲信": [
        "JR東日本",
        "東武",
        "西武",
        "京成",
        "小田急",
        "東急",
        "京王",
        "東京メトロ",
        "都営地下鉄"
      ],

      "北陸": [
        "JR西日本",
        "IRいしかわ鉄道",
        "あいの風とやま鉄道",
        "ハピラインふくい"
      ],

      "東海4県": [
        "JR東海",
        "名古屋鉄道",
        "近鉄",
        "名古屋市交通局",
        "静岡鉄道",
        "伊勢鉄道"
      ],

      "関西": [
        "JR西日本",
        "近鉄",
        "阪急",
        "阪神",
        "南海",
        "京阪",
        "大阪メトロ",
        "山陽電鉄"
      ],

      "中国": [
        "JR西日本",
        "一畑電車",
        "広島電鉄"
      ],

      "四国": [
        "JR四国",
        "ことでん",
        "伊予鉄道",
        "とさでん交通"
      ],

      "九州・沖縄": [
        "JR九州",
        "西日本鉄道",
        "福岡市地下鉄",
        "沖縄都市モノレール"
      ]

    };


    /* ==================================================
       HTML要素
       ================================================== */

    const areaSelect =
      document.getElementById("area");


    const companySelect =
      document.getElementById("company");


    const searchButton =
      document.getElementById("searchButton");


    const results =
      document.getElementById("results");


    const resultCount =
      document.getElementById("resultCount");


    const resultList =
      document.getElementById("resultList");


    /* ==================================================
       きっぷデータ
       ================================================== */

    let tickets = [];


    async function loadTickets() {

      try {

        const response =
          await fetch(
            "./data/tickets.json"
          );


        if (!response.ok) {

          throw new Error(
            "tickets.jsonを読み込めませんでした"
          );

        }


        const data =
          await response.json();


        tickets =
          data.tickets || [];


      } catch (error) {

        console.error(error);


        resultList.innerHTML = `

          <div class="data-error">

            きっぷデータを読み込めませんでした。

            <br><br>

            <strong>
              data/tickets.json
            </strong>

            が正しく配置されているか確認してください。

          </div>

        `;


        results.style.display =
          "block";

      }

    }


    /* ==================================================
       エリア変更
       ================================================== */

    areaSelect.addEventListener(
      "change",
      function () {


        const selectedArea =
          this.value;


        companySelect.innerHTML =
          "";


        /*
         * 指定なし
         */

        const noneOption =
          document.createElement(
            "option"
          );


        noneOption.value =
          "";


        noneOption.textContent =
          "指定なし";


        companySelect.appendChild(
          noneOption
        );


        /*
         * エリア未指定なら
         * 全社局を表示
         */

        if (
          selectedArea === ""
        ) {


          const allCompanies =
            new Set();


          Object.values(
            companiesByArea
          ).forEach(
            companies => {

              companies.forEach(
                company => {

                  allCompanies.add(
                    company
                  );

                }
              );

            }
          );


          [...allCompanies]
            .sort()
            .forEach(
              company => {


                const option =
                  document.createElement(
                    "option"
                  );


                option.value =
                  company;


                option.textContent =
                  company;


                companySelect.appendChild(
                  option
                );

              }
            );


          return;

        }


        /*
         * エリア指定あり
         */

        const companies =
          companiesByArea[
            selectedArea
          ] || [];


        companies.forEach(
          company => {


            const option =
              document.createElement(
                "option"
              );


            option.value =
              company;


            option.textContent =
              company;


            companySelect.appendChild(
              option
            );

          }
        );

      }
    );


    /* ==================================================
       検索ボタン
       ================================================== */

    searchButton.addEventListener(
      "click",
      searchTickets
    );


    /* ==================================================
       検索
       ================================================== */

    function searchTickets() {


      const area =
        areaSelect.value;


      const company =
        companySelect.value;


      const ticketType =
        document.getElementById(
          "ticketType"
        ).value;


      const media =
        document.getElementById(
          "media"
        ).value;


      /*
       * 選択された曜日
       */

      const selectedWeekdays =
        [
          ...document.querySelectorAll(
            ".weekday-list input:checked"
          )
        ].map(
          input => input.value
        );


      /*
       * 絞り込み
       */

      const filteredTickets =
        tickets.filter(
          ticket => {


            /*
             * エリア
             */

            if (
              area !== "" &&
              !ticket.areas.includes(
                area
              )
            ) {

              return false;

            }


            /*
             * 社局
             */

            if (
              company !== "" &&
              !ticket.companies.includes(
                company
              )
            ) {

              return false;

            }


            /*
             * 種類
             */

            if (
              ticketType !== "" &&
              ticket.type !== ticketType
            ) {

              return false;

            }


            /*
             * 媒体
             */

            if (
              media !== "" &&
              ticket.medium !== media
            ) {

              return false;

            }


            /*
             * 曜日
             *
             * 選択した曜日を
             * すべて満たす必要がある
             */

            if (
              selectedWeekdays.length > 0
            ) {


              const matches =
                selectedWeekdays.every(
                  day =>
                    ticket.weekdays.includes(
                      day
                    )
                );


              if (!matches) {

                return false;

              }

            }


            return true;

          }
        );


      /* ==================================================
         結果表示
         ================================================== */

      results.style.display =
        "block";


      resultCount.textContent =
        `${filteredTickets.length}件のきっぷが見つかりました`;


      resultList.innerHTML =
        "";


      /*
       * 0件
       */

      if (
        filteredTickets.length === 0
      ) {


        resultList.innerHTML = `

          <div class="no-result">

            条件に一致するきっぷはありませんでした。

          </div>

        `;


        return;

      }


      /*
       * きっぷカード
       */

      filteredTickets.forEach(
        ticket => {


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "ticket-card";


          /*
           * 社局タグ
           */

          const companyTags =
            ticket.companies
              .map(
                company => `

                  <span
                    class="ticket-tag company-tag"
                  >
                    ${company}
                  </span>

                `
              )
              .join("");


          /*
           * 曜日
           */

          const weekdayText =
            ticket.weekdays.join("・");


          /*
           * 価格
           */

          const priceText =
            ticket.price &&
            ticket.price.adult != null

              ? `¥${ticket.price.adult.toLocaleString()}`

              : "価格情報なし";


          /*
           * カードHTML
           */

          card.innerHTML = `

            <div class="ticket-tags">

              ${companyTags}

              <span
                class="ticket-tag type-tag"
              >
                ${ticket.type}
              </span>

              <span
                class="ticket-tag weekday-tag"
              >
                ${weekdayText}
              </span>

            </div>


            <div class="ticket-title-row">

              <div class="ticket-name">
                ${ticket.name}
              </div>


              <div class="ticket-price">
                ${priceText}
              </div>

            </div>


            <div class="ticket-description">
              ${ticket.description}
            </div>


            <div class="ticket-details">

              媒体：
              ${ticket.medium}

              <br>

              利用エリア：
              ${ticket.usageArea}

            </div>


            <a
              class="official-link"
              href="${ticket.officialUrl}"
              target="_blank"
              rel="noopener noreferrer"
            >
              &gt;&gt;公式サイトへ
            </a>

          `;


          resultList.appendChild(
            card
          );

        }
      );

    }


    /* ==================================================
       起動
       ================================================== */

    loadTickets();


  </script>

</body>
</html>
