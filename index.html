<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>きっぷゴー</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: "BIZ UDPGothic", sans-serif;
      color: #111;
      background:
        linear-gradient(
          to bottom,
          #ccefe4 0%,
          #ccefe4 43%,
          #8bc782 43%,
          #8bc782 54%,
          #ccefe4 54%,
          #ccefe4 70%,
          #ffffff 70%,
          #ffffff 100%
        );
      min-height: 100vh;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    .top-area {
      width: 100%;
      text-align: center;
      padding-top: 45px;
    }

    .welcome {
      margin: 0;
      font-size: clamp(32px, 5vw, 64px);
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .search-title {
      margin: 245px 0 25px;
      font-size: clamp(25px, 3vw, 42px);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .search-panel {
      width: min(1100px, calc(100% - 50px));
      margin: 0 auto;
      padding: 32px 40px 35px;

      background: #fff;
      border: 4px solid #111;
      border-radius: 22px;
    }

    .search-row {
      display: grid;
      grid-template-columns:
        1fr
        1fr
        1fr
        1fr
        90px;

      gap: 18px;
      align-items: end;
    }

    .field {
      min-width: 0;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      font-size: 17px;
      font-weight: 700;
    }

    select {
      width: 100%;
      height: 48px;
      padding: 0 38px 0 14px;

      font-family: inherit;
      font-size: 16px;
      color: #111;

      background: #fff;
      border: 2px solid #111;
      border-radius: 8px;

      cursor: pointer;
    }

    .search-button {
      position: relative;

      width: 66px;
      height: 66px;

      margin: 0 auto;

      border: none;
      border-radius: 50%;

      background: #1769e0;

      cursor: pointer;
    }

    .search-button:hover {
      background: #0f57c4;
    }

    .search-button::before {
      content: "";

      position: absolute;

      width: 21px;
      height: 21px;

      left: 20px;
      top: 18px;

      border: 4px solid #fff;
      border-radius: 50%;
    }

    .search-button::after {
      content: "";

      position: absolute;

      width: 17px;
      height: 4px;

      left: 39px;
      top: 43px;

      background: #fff;
      border-radius: 3px;

      transform: rotate(45deg);
      transform-origin: left center;
    }

    .weekday-area {
      margin-top: 28px;
    }

    .weekday-label {
      display: block;
      margin-bottom: 12px;

      font-size: 17px;
      font-weight: 700;
    }

    .weekday-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .weekday-option {
      position: relative;
    }

    .weekday-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .weekday-option label {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 55px;
      height: 42px;
      padding: 0 14px;

      border: 2px solid #111;
      border-radius: 8px;

      background: #fff;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;
      user-select: none;
    }

    .weekday-option input:checked + label {
      background: #8bc782;
      color: #fff;
    }

    .weekday-option.saturday label {
      color: #0066cc;
    }

    .weekday-option.sunday label,
    .weekday-option.holiday label {
      color: #d60000;
    }

    .weekday-option input:checked + label {
      color: #fff;
    }

    .results {
      display: none;

      width: min(1100px, calc(100% - 50px));
      margin: 55px auto 0;
    }

    .results-title {
      margin: 0 0 22px;

      font-size: clamp(24px, 3vw, 36px);
      font-weight: 700;
    }

    .result-count {
      margin-bottom: 20px;
      font-size: 16px;
      font-weight: 700;
    }

    .result-card {
      margin-bottom: 22px;
      padding: 25px;

      background: #fff;
      border: 3px solid #111;
      border-radius: 16px;
    }

    .result-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tag {
      display: inline-block;

      padding: 6px 11px;

      border-radius: 999px;

      background: #e5f3ed;

      font-size: 13px;
      font-weight: 700;
    }

    .result-name {
      margin: 0 0 12px;

      font-size: clamp(22px, 3vw, 30px);
      line-height: 1.5;
    }

    .result-price {
      margin-bottom: 15px;

      font-size: 22px;
      font-weight: 700;
    }

    .result-price span {
      font-size: 14px;
      font-weight: 400;
    }

    .result-description {
      margin: 0 0 15px;

      line-height: 1.8;
    }

    .result-info {
      display: grid;
      gap: 7px;

      margin-top: 18px;
      padding-top: 18px;

      border-top: 1px solid #ccc;

      font-size: 14px;
      line-height: 1.7;
    }

    .result-info strong {
      font-weight: 700;
    }

    .notes {
      margin: 14px 0 0;
      padding-left: 20px;

      font-size: 14px;
      line-height: 1.8;
    }

    .official-link {
      display: inline-block;
      margin-top: 18px;

      color: #075bc4;
      font-weight: 700;
      text-decoration: underline;
    }

    .no-results {
      padding: 40px 20px;

      background: #fff;
      border: 3px solid #111;
      border-radius: 16px;

      text-align: center;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.8;
    }

    .error-message {
      padding: 35px 20px;

      background: #fff;
      border: 3px solid #b00000;
      border-radius: 16px;

      text-align: center;

      color: #b00000;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.9;
    }

    @media (max-width: 900px) {
      body {
        background:
          linear-gradient(
            to bottom,
            #ccefe4 0%,
            #ccefe4 39%,
            #8bc782 39%,
            #8bc782 50%,
            #ccefe4 50%,
            #ccefe4 68%,
            #ffffff 68%,
            #ffffff 100%
          );
      }

      .search-title {
        margin-top: 180px;
      }

      .search-row {
        grid-template-columns: 1fr 1fr;
      }

      .search-button {
        margin: 0;
      }
    }

    @media (max-width: 600px) {
      .page {
        padding-bottom: 50px;
      }

      .top-area {
        padding-top: 30px;
      }

      .welcome {
        font-size: 34px;
      }

      .search-title {
        margin-top: 120px;
        font-size: 25px;
      }

      .search-panel {
        width: calc(100% - 24px);
        padding: 22px 18px 25px;
        border-width: 3px;
        border-radius: 16px;
      }

      .search-row {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .search-button {
        width: 60px;
        height: 60px;
        margin-top: 5px;
      }

      .results {
        width: calc(100% - 24px);
        margin-top: 35px;
      }

      .result-card {
        padding: 20px;
      }

      .weekday-list {
        gap: 7px;
      }

      .weekday-option label {
        min-width: 45px;
        padding: 0 10px;
      }
    }
  </style>
</head>

        </div>

        <!-- 曜日 -->

            利用できる曜日

          <div class="weekday-list">

            <div class="weekday-option">

            <div class="weekday-option">

            <div class="weekday-option">

              >
              <label for="wed">水</label>
            </div>

            <div class="weekday-option">

                type="checkbox"

                value="木"

            </div>

            <div class="weekday-option">
              <input

            <div class="weekday-option saturday">

            <div class="weekday-option sunday">

            <div class="weekday-option holiday">
              <input
                type="checkbox"
                id="holiday"
                value="祝"
              >
              <label for="holiday">祝</label>
            </div>

          </div>
        </div>

      </section>

    </div>

    >

        検索結果
      </h2>

      <div

      <div id="resultList"></div>

    /*

    const areaSelect =

    /*
     * ========================================
     * きっぷデータ
     * ========================================
     */

    let tickets = [];

    let ticketsLoaded = false;


    /*
     * ========================================
     * tickets.jsonを読み込む
     * ========================================
     */

    async function loadTickets() {

      try {

        const response =
          await fetch("./data/tickets.json");

        if (!response.ok) {

          throw new Error(
            "tickets.jsonの読み込みに失敗しました"
          );

        }

        const data =
          await response.json();

        tickets =
          Array.isArray(data.tickets)
            ? data.tickets
            : [];

        ticketsLoaded = true;

      } catch (error) {

        console.error(
          "きっぷデータの読み込みに失敗しました:",
          error
        );

        ticketsLoaded = false;

      }

    }


    /*
     * ========================================
     * エリア選択肢を作成
     * ========================================
     */

    function setupAreas() {

      Object.keys(companiesByArea)
        .forEach(area => {

          const option =
            document.createElement("option");

          option.value = area;
          option.textContent = area;

          areaSelect.appendChild(option);

        });

    }

      const selectedArea =
        areaSelect.value;

      companySelect.innerHTML = "";

      const defaultOption =
        document.createElement("option");

      defaultOption.value = "";
      defaultOption.textContent = "指定なし";

      companySelect.appendChild(
        defaultOption
      );


      /*
       * エリア指定なしの場合
       * 全社局を表示
       */

      if (selectedArea === "") {

        const allCompanies =
          new Set();

        Object.values(companiesByArea)
          .forEach(companies => {

            companies.forEach(company => {

              allCompanies.add(company);

            });

          });

        Array.from(allCompanies)
          .sort((a, b) =>
            a.localeCompare(b, "ja")
          )
          .forEach(company => {

            const option =
              document.createElement("option");

            option.value = company;
            option.textContent = company;

            companySelect.appendChild(
              option
            );

          });

        return;

      }


      /*
       * エリアが指定されている場合
       * そのエリアの社局だけ表示
       */

      const companies =
        companiesByArea[selectedArea] || [];

      companies.forEach(company => {

        const option =
          document.createElement("option");

        option.value = company;
        option.textContent = company;

        companySelect.appendChild(
          option
        );

      });

    }


    /*
     * ========================================
     * 曜日を取得
     * ========================================
     */

    function getSelectedWeekdays() {

      const checkboxes =
        document.querySelectorAll(
          ".weekday-option input:checked"
        );

      return Array.from(checkboxes)
        .map(input => input.value);

    }


    /*
     * ========================================
     * 検索
     * ========================================
     */

    async function searchTickets() {

      /*
       * まだ読み込んでいない場合だけ
       * ここで読み込む
       */

      if (!ticketsLoaded) {

        await loadTickets();

      }


      /*
       * 読み込みに失敗した場合
       */

      if (!ticketsLoaded) {

        results.style.display = "block";

        resultCount.textContent = "";

        resultList.innerHTML = `
          <div class="error-message">
            きっぷデータを読み込めませんでした。<br>
            ネットワーク接続を確認してください。<br>
            何度も表示される場合は、運営にお問い合わせください。
          </div>
        `;

        return;

      }


      /*
       * 検索条件取得
       */

      const area =
        areaSelect.value;

      const company =
        companySelect.value;

      const ticketType =
        ticketTypeSelect.value;

      const media =
        mediaSelect.value;

      const selectedWeekdays =
        getSelectedWeekdays();


      /*
       * 条件に合うきっぷだけ残す
       */

      const filteredTickets =
        tickets.filter(ticket => {

          /*
           * エリア
           */

          if (
            area !== "" &&
            !Array.isArray(ticket.areas) ||
            (
              area !== "" &&
              !ticket.areas.includes(area)
            )
          ) {

            return false;

          }


          /*
           * 社局
           */

          if (
            company !== "" &&
            (
              !Array.isArray(ticket.companies) ||
              !ticket.companies.includes(company)
            )
          ) {

            return false;

          }


          /*
           * きっぷの種類
           */

          if (
            ticketType !== "" &&
            ticket.type !== ticketType
          ) {

            return false;

          }


          /*
           * 媒体
           */

          if (
            media !== "" &&
            ticket.medium !== media
          ) {

            return false;

          }


          /*
           * 曜日
           *
           * 選択した曜日を全部含んでいる
           * きっぷだけ表示
           */

          if (
            selectedWeekdays.length > 0
          ) {

            if (
              !Array.isArray(ticket.weekdays)
            ) {

              return false;

            }

            const matches =
              selectedWeekdays.every(
                day =>
                  ticket.weekdays.includes(day)
              );

            if (!matches) {

              return false;

            }

          }


          return true;

        });


      /*
       * 検索結果表示
       */

      results.style.display = "block";

      resultCount.textContent =
        `${filteredTickets.length}件のきっぷが見つかりました。`;

      resultList.innerHTML = "";


      /*
       * 該当なし
       */

      if (filteredTickets.length === 0) {

        resultList.innerHTML = `
          <div class="no-results">
            条件に一致するきっぷはありませんでした。
          </div>
        `;

        return;

      }


      /*
       * 結果カード作成
       */

      filteredTickets.forEach(ticket => {

        const card =
          document.createElement("article");

        card.className =
          "result-card";


        /*
         * 社局タグ
         */

        const companyTags =
          Array.isArray(ticket.companies)
            ? ticket.companies
                .map(company =>
                  `<span class="tag">${escapeHtml(company)}</span>`
                )
                .join("")
            : "";


        /*
         * 曜日
         */

        const weekdays =
          Array.isArray(ticket.weekdays)
            ? ticket.weekdays.join("・")
            : "指定なし";


        /*
         * 価格
         */

        let priceText =
          "料金情報なし";

        if (
          ticket.price &&
          typeof ticket.price.adult === "number"
        ) {

          priceText =
            `大人 ${ticket.price.adult.toLocaleString()}円`;

          if (
            typeof ticket.price.child === "number"
          ) {

            priceText +=
              ` / 子ども ${ticket.price.child.toLocaleString()}円`;

          }

        }


        /*
         * 注意事項
         */

        let notesHtml = "";

        if (
          Array.isArray(ticket.notes) &&
          ticket.notes.length > 0
        ) {

          notesHtml = `
            <div>
              <strong>注意事項</strong>

              <ul class="notes">
                ${ticket.notes
                  .map(note =>
                    `<li>${escapeHtml(note)}</li>`
                  )
                  .join("")}
              </ul>
            </div>
          `;

        }


        /*
         * 公式サイト
         */

        let officialLinkHtml = "";

        if (ticket.officialUrl) {

          officialLinkHtml = `
            <a
              class="official-link"
              href="${escapeAttribute(ticket.officialUrl)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              公式サイトを見る
            </a>
          `;

        }


        /*
         * カードHTML
         */

        card.innerHTML = `

          <div class="result-tags">

            ${companyTags}

            ${
              ticket.type
                ? `<span class="tag">${escapeHtml(ticket.type)}</span>`
                : ""
            }

            ${
              ticket.medium
                ? `<span class="tag">${escapeHtml(ticket.medium)}</span>`
                : ""
            }

          </div>


          <h3 class="result-name">
            ${escapeHtml(ticket.name || "名称未設定")}
          </h3>


          <div class="result-price">
            ${priceText}
          </div>


          ${
            ticket.description
              ? `
                <p class="result-description">
                  ${escapeHtml(ticket.description)}
                </p>
              `
              : ""
          }


          <div class="result-info">

            <div>
              <strong>利用できる曜日：</strong>
              ${escapeHtml(weekdays)}
            </div>

            ${
              ticket.usageArea
                ? `
                  <div>
                    <strong>利用エリア：</strong>
                    ${escapeHtml(ticket.usageArea)}
                  </div>
                `
                : ""
            }

          </div>


          ${notesHtml}

          ${officialLinkHtml}

        `;


        resultList.appendChild(card);

      });

    }


    /*
     * ========================================
     * HTMLエスケープ
     * ========================================
     */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
     * ========================================
     * URL用エスケープ
     * ========================================
     */

    function escapeAttribute(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

    }


    /*
     * ========================================
     * イベント設定
     * ========================================
     */

    areaSelect.addEventListener(
      "change",
      updateCompanies
    );


    searchButton.addEventListener(
      "click",
      searchTickets
    );


    /*
     * ========================================
     * 初期設定
     * ========================================
     */

    setupAreas();

    updateCompanies();


    /*
     * ページを開いた時点では
     * tickets.jsonを読み込まない。
     *
     * 「検索」を押したときに読み込む。
     *
     * そのため、何も検索していない状態で
     * エラーメッセージが表示されることはない。
     */

  </script>

</body>
