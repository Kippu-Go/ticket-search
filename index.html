<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>きっぷGO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        sans-serif;
      background: #f5f9ff;
      color: #222;
    }

    /* ヘッダー */
    header {
      background: #1677d2;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* メイン */
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 35px 20px 60px;
    }

    .welcome {
      text-align: center;
      font-size: 32px;
      margin-bottom: 45px;
      color: #1265b5;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    /* 検索ボックス */
    .search-box {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    select,
    input[type="date"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #c9d6e5;
      border-radius: 8px;
      background: white;
      font-size: 15px;
    }

    select:disabled {
      background: #eeeeee;
      color: #999;
    }

    /* 追加項目 */
    .option-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 15px;
    }

    /* 曜日 */
    .weekday-area {
      margin-top: 20px;
      padding: 18px;
      background: #f5f8fc;
      border-radius: 10px;
    }

    .weekday-title {
      font-weight: bold;
      margin-bottom: 12px;
    }

    .weekday-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .weekday-list label {
      background: white;
      border: 1px solid #ccd8e5;
      border-radius: 7px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: normal;
    }

    .weekday-list input {
      margin-right: 5px;
    }

    /* 検索ボタン */
    .search-button-area {
      text-align: center;
      margin-top: 25px;
    }

    .search-button {
      width: 70px;
      height: 70px;
      border: none;
      border-radius: 50%;
      background: #1677d2;
      cursor: pointer;
      position: relative;
      transition: 0.2s;
    }

    .search-button:hover {
      background: #0e61ad;
      transform: scale(1.05);
    }

    /* ○ */
    .search-button::before {
      content: "";
      position: absolute;
      width: 25px;
      height: 25px;
      border: 4px solid white;
      border-radius: 50%;
      left: 18px;
      top: 17px;
    }

    /* ＼ */
    .search-button::after {
      content: "";
      position: absolute;
      width: 17px;
      height: 4px;
      background: white;
      transform: rotate(45deg);
      left: 40px;
      top: 44px;
      border-radius: 3px;
    }

    /* 検索結果 */
    #results {
      display: none;
      margin-top: 45px;
    }

    .result-count {
      margin-bottom: 15px;
      font-weight: bold;
    }

    .ticket-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
      border-left: 5px solid #1677d2;
    }

    .ticket-name {
      font-size: 20px;
      font-weight: bold;
      color: #1265b5;
      margin-bottom: 10px;
    }

    .ticket-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px 20px;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .ticket-description {
      margin-top: 10px;
      line-height: 1.6;
    }

    .official-link {
      display: inline-block;
      margin-top: 12px;
      color: #1677d2;
      text-decoration: none;
      font-weight: bold;
    }

    .official-link:hover {
      text-decoration: underline;
    }

    .no-result {
      background: white;
      padding: 25px;
      text-align: center;
      border-radius: 12px;
      color: #666;
    }

    /* スマホ */
    @media (max-width: 700px) {
      .search-row {
        grid-template-columns: 1fr;
      }

      .option-row {
        grid-template-columns: 1fr;
      }

      .welcome {
        font-size: 26px;
      }

      .ticket-info {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">きっぷGO</div>
</header>

<main>

  <div class="welcome">
    きっぷGOへようこそ！
  </div>

  <h2>お得なきっぷを検索する</h2>

  <div class="search-box">

    <!-- 基本検索 -->
    <div class="search-row">

      <div class="form-group">
        <label for="area">エリア</label>
        <select id="area">
          <option value="">指定なし</option>
          <option value="北海道">北海道</option>
          <option value="東北">東北</option>
          <option value="関東甲信">関東甲信</option>
          <option value="北陸">北陸</option>
          <option value="東海4県">東海4県</option>
          <option value="関西">関西</option>
          <option value="中国">中国</option>
          <option value="四国">四国</option>
          <option value="九州・沖縄">九州・沖縄</option>
        </select>
      </div>

      <div class="form-group">
        <label for="company">社局名</label>
        <select id="company">
          <option value="">指定なし</option>
        </select>
      </div>

      <div class="form-group">
        <label for="date">利用日</label>
        <input type="date" id="date">
      </div>

    </div>

    <!-- きっぷ種類・媒体 -->
    <div class="option-row">

      <div class="form-group">
        <label for="ticketType">きっぷの種類</label>
        <select id="ticketType">
          <option value="">指定なし</option>
          <option value="回数券">回数券</option>
          <option value="フリーパス">フリーパス</option>
          <option value="往復">往復</option>
        </select>
      </div>

      <div class="form-group">
        <label for="media">媒体</label>
        <select id="media">
          <option value="">指定なし</option>
          <option value="紙">紙</option>
          <option value="デジタル">デジタル</option>
        </select>
      </div>

    </div>

    <!-- 曜日 -->
    <div class="weekday-area">
      <div class="weekday-title">利用できる曜日</div>

      <div class="weekday-list">
        <label>
          <input type="checkbox" value="月">月
        </label>

        <label>
          <input type="checkbox" value="火">火
        </label>

        <label>
          <input type="checkbox" value="水">水
        </label>

        <label>
          <input type="checkbox" value="木">木
        </label>

        <label>
          <input type="checkbox" value="金">金
        </label>

        <label>
          <input type="checkbox" value="土">土
        </label>

        <label>
          <input type="checkbox" value="日">日
        </label>

        <label>
          <input type="checkbox" value="祝">祝
        </label>
      </div>
    </div>

    <!-- 検索ボタン -->
    <div class="search-button-area">
      <button
        class="search-button"
        id="searchButton"
        aria-label="検索"
      ></button>
    </div>

  </div>


  <!-- 検索結果 -->
  <section id="results">

    <h2>検索結果</h2>

    <div id="resultCount" class="result-count"></div>

    <div id="resultList"></div>

  </section>

</main>


<script>

  /*
   * 社局とエリアの対応
   *
   * 今後きっぷのデータを増やすときは、
   * ここに社局を追加していけばOK。
   */
  const companiesByArea = {

    "北海道": [
      "JR北海道"
    ],

    "東北": [
      "JR東日本",
      "仙台市交通局"
    ],

    "関東甲信": [
      "JR東日本",
      "東武",
      "西武",
      "京成",
      "小田急",
      "東急",
      "京王",
      "東京メトロ",
      "都営地下鉄"
    ],

    "北陸": [
      "JR西日本",
      "IRいしかわ鉄道",
      "あいの風とやま鉄道",
      "ハピラインふくい"
    ],

    "東海4県": [
      "JR東海",
      "名古屋鉄道",
      "近鉄",
      "名古屋市交通局",
      "静岡鉄道"
    ],

    "関西": [
      "JR西日本",
      "近鉄",
      "阪急",
      "阪神",
      "南海",
      "京阪",
      "大阪メトロ",
      "山陽電鉄"
    ],

    "中国": [
      "JR西日本",
      "一畑電車",
      "広島電鉄"
    ],

    "四国": [
      "JR四国",
      "ことでん",
      "伊予鉄道",
      "とさでん交通"
    ],

    "九州・沖縄": [
      "JR九州",
      "西日本鉄道",
      "福岡市地下鉄",
      "沖縄都市モノレール"
    ]
  };


  /*
   * テスト用きっぷデータ
   *
   * 実際のデータを入れるときは、
   * この部分を増やしていけばOK。
   */
  const tickets = [

    {
      name: "伊勢・鳥羽フリーきっぷ",
      company: "近鉄",
      area: "東海4県",
      type: "フリーパス",
      media: "紙",
      validFrom: "2026-04-01",
      validTo: "2027-03-31",
      weekdays: ["土", "日", "祝"],
      price: 2500,
      description: "伊勢・鳥羽周辺を自由に利用できるフリーきっぷです。",
      officialUrl: "#"
    },

    {
      name: "東海おでかけパス",
      company: "JR東海",
      area: "東海4県",
      type: "フリーパス",
      media: "デジタル",
      validFrom: "2026-04-01",
      validTo: "2027-03-31",
      weekdays: ["土", "日", "祝"],
      price: 2720,
      description: "東海エリアのおでかけに利用できるきっぷです。",
      officialUrl: "#"
    },

    {
      name: "関西おでかけフリーきっぷ",
      company: "阪急",
      area: "関西",
      type: "フリーパス",
      media: "デジタル",
      validFrom: "2026-04-01",
      validTo: "2027-03-31",
      weekdays: ["土", "日", "祝"],
      price: 1500,
      description: "関西のおでかけに利用できるフリーきっぷです。",
      officialUrl: "#"
    },

    {
      name: "近畿ワンデーパス",
      company: "近鉄",
      area: "関西",
      type: "フリーパス",
      media: "紙",
      validFrom: "2026-04-01",
      validTo: "2027-03-31",
      weekdays: ["土", "日", "祝"],
      price: 1800,
      description: "近畿エリアの移動に利用できるきっぷです。",
      officialUrl: "#"
    }

  ];


  const areaSelect = document.getElementById("area");
  const companySelect = document.getElementById("company");
  const searchButton = document.getElementById("searchButton");

  const results = document.getElementById("results");
  const resultCount = document.getElementById("resultCount");
  const resultList = document.getElementById("resultList");


  /*
   * エリア変更時
   * ↓
   * そのエリアに対応する社局だけ表示
   */
  areaSelect.addEventListener("change", function() {

    const selectedArea = this.value;

    companySelect.innerHTML = "";

    // エリア未指定
    if (selectedArea === "") {

      const option = document.createElement("option");
      option.value = "";
      option.textContent = "指定なし";

      companySelect.appendChild(option);

      // 現在登録されている社局を全部表示
      const allCompanies = new Set();

      Object.values(companiesByArea).forEach(companies => {
        companies.forEach(company => {
          allCompanies.add(company);
        });
      });

      [...allCompanies].sort().forEach(company => {

        const option = document.createElement("option");

        option.value = company;
        option.textContent = company;

        companySelect.appendChild(option);

      });

      return;
    }


    // 指定されたエリアの社局だけ表示
    const companies = companiesByArea[selectedArea] || [];

    const noneOption = document.createElement("option");
    noneOption.value = "";
    noneOption.textContent = "指定なし";

    companySelect.appendChild(noneOption);


    companies.forEach(company => {

      const option = document.createElement("option");

      option.value = company;
      option.textContent = company;

      companySelect.appendChild(option);

    });

  });


  /*
   * 検索
   */
  searchButton.addEventListener("click", searchTickets);


  function searchTickets() {

    const area = areaSelect.value;
    const company = companySelect.value;

    const date = document.getElementById("date").value;

    const ticketType =
      document.getElementById("ticketType").value;

    const media =
      document.getElementById("media").value;


    // 選択された曜日
    const selectedWeekdays = [
      ...document.querySelectorAll(
        ".weekday-list input:checked"
      )
    ].map(input => input.value);


    /*
     * 条件に合うきっぷだけ残す
     */
    const filteredTickets = tickets.filter(ticket => {

      // エリア
      if (
        area !== "" &&
        ticket.area !== area
      ) {
        return false;
      }


      // 社局
      if (
        company !== "" &&
        ticket.company !== company
      ) {
        return false;
      }


      // きっぷの種類
      if (
        ticketType !== "" &&
        ticket.type !== ticketType
      ) {
        return false;
      }


      // 媒体
      if (
        media !== "" &&
        ticket.media !== media
      ) {
        return false;
      }


      // 利用日
      if (date !== "") {

        if (
          date < ticket.validFrom ||
          date > ticket.validTo
        ) {
          return false;
        }

      }


      // 曜日
      if (selectedWeekdays.length > 0) {

        const matchesWeekday =
          selectedWeekdays.some(day =>
            ticket.weekdays.includes(day)
          );

        if (!matchesWeekday) {
          return false;
        }

      }


      return true;

    });


    /*
     * 検索結果を表示
     *
     * 初回はdisplay:noneなので、
     * 検索ボタンを押したときに初めて表示される。
     */
    results.style.display = "block";


    resultCount.textContent =
      `${filteredTickets.length}件のきっぷが見つかりました`;


    resultList.innerHTML = "";


    // 0件
    if (filteredTickets.length === 0) {

      resultList.innerHTML = `
        <div class="no-result">
          条件に一致するきっぷはありませんでした。
        </div>
      `;

      return;
    }


    // 結果表示
    filteredTickets.forEach(ticket => {

      const card = document.createElement("div");

      card.className = "ticket-card";


      card.innerHTML = `

        <div class="ticket-name">
          ${ticket.name}
        </div>

        <div class="ticket-info">

          <div>
            <strong>社局：</strong>
            ${ticket.company}
          </div>

          <div>
            <strong>エリア：</strong>
            ${ticket.area}
          </div>

          <div>
            <strong>種類：</strong>
            ${ticket.type}
          </div>

          <div>
            <strong>媒体：</strong>
            ${ticket.media}
          </div>

          <div>
            <strong>価格：</strong>
            ${ticket.price.toLocaleString()}円
          </div>

          <div>
            <strong>利用期間：</strong>
            ${ticket.validFrom} ～ ${ticket.validTo}
          </div>

        </div>

        <div class="ticket-description">
          ${ticket.description}
        </div>

        <a
          class="official-link"
          href="${ticket.officialUrl}"
          target="_blank"
          rel="noopener noreferrer"
        >
          公式サイトを見る →
        </a>

      `;


      resultList.appendChild(card);

    });

  }


  /*
   * ページを開いたときは検索しない。
   *
   * つまり、ここでは searchTickets() を呼ばない。
   */

</script>

</body>
</html>
