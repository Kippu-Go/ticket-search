<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- BIZ UDPGothic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <title>きっぷゴー</title>

  <style>

    /* ==================================================
       基本設定
       ================================================== */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      font-family:
        "BIZ UDPGothic",
        sans-serif;

      color: #111;

      background: #baf4df;
    }


    /* ==================================================
       ページ全体
       ================================================== */

    .page {
      position: relative;

      min-height: 100vh;

      overflow: hidden;

      background: #baf4df;
    }


    /* ==================================================
       添付画像をイメージした緑色の横帯
       ================================================== */

    .green-band {
      position: absolute;

      left: 0;
      right: 0;

      top: 610px;

      height: 110px;

      background: #62c45d;

      z-index: 0;
    }


    /* ==================================================
       メイン
       ================================================== */

    main {
      position: relative;

      z-index: 1;

      width: min(1100px, 100%);

      margin: 0 auto;

      padding:
        95px 30px 100px;
    }


    /* ==================================================
       「きっぷゴーへようこそ！」
       ================================================== */

    .welcome {
      text-align: center;

      font-size:
        clamp(38px, 5vw, 64px);

      font-weight: 400;

      line-height: 1.4;

      margin:
        0 0 115px;
    }


    /* ==================================================
       検索パネル
       ================================================== */

    .search-panel {
      position: relative;

      width: min(1000px, 100%);

      margin: 0 auto;

      padding:
        55px 65px 60px;

      background: #ffffff;

      border:
        3px solid #111;

      border-radius: 42px;

      box-shadow:
        0 2px 0 rgba(0, 0, 0, 0.05);
    }


    /* ==================================================
       検索パネルタイトル
       ================================================== */

    .search-title {
      text-align: center;

      font-size:
        clamp(28px, 4vw, 42px);

      font-weight: 700;

      margin:
        0 0 48px;
    }


    /* ==================================================
       検索項目
       ================================================== */

    .search-row {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 24px;

      margin-bottom: 24px;
    }


    .form-group {
      display: flex;

      flex-direction: column;

      gap: 9px;
    }


    .form-group label {
      font-size: 17px;

      font-weight: 700;
    }


    /* ==================================================
       セレクトボックス
       ================================================== */

    select {
      width: 100%;

      min-height: 58px;

      padding:
        10px 45px 10px 16px;

      border:
        2px solid #333;

      border-radius: 10px;

      background: #fff;

      font-family:
        "BIZ UDPGothic",
        sans-serif;

      font-size: 17px;

      color: #111;

      cursor: pointer;
    }


    select:focus {
      outline:
        3px solid rgba(22, 119, 210, 0.25);

      border-color: #1677d2;
    }


    /* ==================================================
       曜日
       ================================================== */

    .weekday-area {
      margin-top: 35px;
    }


    .weekday-title {
      text-align: center;

      font-size: 20px;

      font-weight: 700;

      margin-bottom: 18px;
    }


    .weekday-list {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 10px;
    }


    .weekday-list label {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-width: 65px;

      min-height: 52px;

      padding:
        8px 13px;

      background: #fff;

      border:
        2px solid #333;

      border-radius: 9px;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;

      user-select: none;

      transition:
        background 0.15s,
        transform 0.15s;
    }


    .weekday-list label:hover {
      background: #f2f2f2;

      transform:
        translateY(-1px);
    }


    .weekday-list input {
      width: 17px;

      height: 17px;

      margin:
        0 7px 0 0;

      cursor: pointer;
    }


    /* ==================================================
       曜日の色
       ================================================== */

    /* 月〜金 */

    .weekday-normal {
      color: #111 !important;
    }


    /* 土曜日 → 青 */

    .weekday-saturday {
      color: #1677d2 !important;
    }


    /* 日曜日 → 赤 */

    .weekday-sunday {
      color: #e53935 !important;
    }


    /* 祝日 → 赤 */

    .weekday-holiday {
      color: #e53935 !important;
    }


    /* ==================================================
       検索ボタン
       ================================================== */

    .search-button-area {
      display: flex;

      justify-content: center;

      margin-top: 42px;
    }


    .search-button {
      position: relative;

      width: 76px;

      height: 76px;

      padding: 0;

      border: none;

      border-radius: 50%;

      background: #1677d2;

      cursor: pointer;

      transition:
        transform 0.15s,
        background 0.15s;

      overflow: hidden;
    }


    .search-button:hover {
      background: #0f62b0;

      transform:
        scale(1.05);
    }


    .search-button:active {
      transform:
        scale(0.97);
    }


    /* 虫めがね本体 */

    .search-button::before {
      content: "";

      position: absolute;

      width: 25px;

      height: 25px;

      left: 21px;

      top: 19px;

      border:
        4px solid #fff;

      border-radius: 50%;
    }


    /* 虫めがねの持ち手 */

    .search-button::after {
      content: "";

      position: absolute;

      width: 18px;

      height: 4px;

      left: 43px;

      top: 45px;

      background: #fff;

      border-radius: 4px;

      transform:
        rotate(45deg);

      transform-origin:
        left center;
    }


    /* ==================================================
       検索結果全体
       ================================================== */

    #results {
      position: relative;

      z-index: 1;

      display: none;

      width: min(1000px, 100%);

      /*
       * 添付画像の白い部分に近い
       * 横長のパネル
       */

      min-height: 560px;

      margin:
        90px auto 0;

      padding:
        55px 65px 75px;

      background: #ffffff;

      border:
        3px solid #111;

      border-radius: 42px;

      box-shadow:
        0 2px 0 rgba(0, 0, 0, 0.05);
    }


    /* ==================================================
       検索結果タイトル
       ================================================== */

    #results h2 {
      text-align: center;

      font-size:
        clamp(30px, 4vw, 42px);

      font-weight: 700;

      margin:
        0 0 35px;
    }


    /* ==================================================
       件数
       ================================================== */

    .result-count {
      font-size: 18px;

      font-weight: 700;

      margin-bottom: 25px;
    }


    /* ==================================================
       きっぷカード
       ================================================== */

    .ticket-card {
      background: #fff;

      border:
        3px solid #111;

      border-radius: 30px;

      padding:
        35px 40px;

      margin-bottom: 28px;

      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.04);
    }


    /* ==================================================
       タグ
       ================================================== */

    .ticket-tags {
      display: flex;

      flex-wrap: wrap;

      gap: 10px;

      margin-bottom: 28px;
    }


    .ticket-tag {
      display: inline-block;

      padding:
        10px 15px;

      border-radius: 10px;

      color: #fff;

      font-size: 16px;

      font-weight: 700;
    }


    .company-tag {
      background: #f28c00;
    }


    .company-tag:nth-child(2) {
      background: #315bea;
    }


    .company-tag:nth-child(3) {
      background: #7b55d9;
    }


    .type-tag {
      background: #62c45d;
    }


    .weekday-tag {
      background: #e85a4f;
    }


    /* ==================================================
       きっぷ名・価格
       ================================================== */

    .ticket-title-row {
      display: flex;

      align-items: baseline;

      flex-wrap: wrap;

      gap: 20px;

      margin-bottom: 25px;
    }


    .ticket-name {
      font-size:
        clamp(30px, 5vw, 52px);

      font-weight: 700;

      line-height: 1.3;
    }


    .ticket-price {
      font-size: 30px;

      font-weight: 700;

      white-space: nowrap;
    }


    /* ==================================================
       説明
       ================================================== */

    .ticket-description {
      font-size: 18px;

      line-height: 1.8;

      margin-bottom: 25px;
    }


    /* ==================================================
       詳細
       ================================================== */

    .ticket-details {
      font-size: 15px;

      line-height: 1.8;

      color: #444;

      margin-bottom: 22px;
    }


    /* ==================================================
       公式サイト
       ================================================== */

    .official-link {
      color: #1677d2;

      font-size: 17px;

      font-weight: 700;

      text-decoration: underline;
    }


    .official-link:hover {
      color: #0f62b0;
    }


    /* ==================================================
       検索結果 0件
       ================================================== */

    .no-result {
      background: #fff;

      border:
        2px solid #333;

      border-radius: 20px;

      padding: 40px;

      text-align: center;

      font-size: 18px;
    }


    /* ==================================================
       データ読み込みエラー
       ================================================== */

    .data-error {
      background: #fff;

      border:
        3px solid #d33;

      border-radius: 20px;

      padding: 30px;

      text-align: center;

      color: #b00000;

      line-height: 1.8;
    }


    /* ==================================================
       タブレット・スマートフォン
       ================================================== */

    @media (max-width: 700px) {

      .green-band {
        top: 560px;

        height: 90px;
      }


      main {
        padding:
          55px 15px 70px;
      }


      .welcome {
        margin-bottom: 70px;

        font-size: 35px;
      }


      /* 検索パネル */

      .search-panel {
        padding:
          35px 20px 40px;

        border-radius: 28px;
      }


      .search-title {
        font-size: 27px;

        margin-bottom: 32px;
      }


      .search-row {
        grid-template-columns: 1fr;

        gap: 18px;

        margin-bottom: 18px;
      }


      /* 曜日 */

      .weekday-area {
        margin-top: 25px;
      }


      .weekday-list {
        gap: 7px;
      }


      .weekday-list label {
        min-width: 55px;

        min-height: 48px;

        font-size: 15px;
      }


      /* 検索ボタン */

      .search-button-area {
        margin-top: 32px;
      }


      .search-button {
        width: 68px;

        height: 68px;
      }


      .search-button::before {
        width: 22px;

        height: 22px;

        left: 18px;

        top: 17px;
      }


      .search-button::after {
        width: 16px;

        left: 39px;

        top: 41px;
      }


      /* ==================================================
         検索結果
         ================================================== */

      #results {
        width: 100%;

        min-height: 500px;

        margin-top: 70px;

        padding:
          35px 20px 50px;

        border-radius: 28px;
      }


      #results h2 {
        font-size: 27px;

        margin-bottom: 28px;
      }


      /* きっぷカード */

      .ticket-card {
        padding:
          25px 20px;

        border-radius: 25px;
      }


      .ticket-name {
        font-size: 34px;
      }


      .ticket-price {
        font-size: 25px;
      }


      .ticket-description {
        font-size: 16px;
      }

    }


    /* ==================================================
       小さいスマートフォン
       ================================================== */

    @media (max-width: 420px) {

      .welcome {
        font-size: 29px;
      }


      .search-title {
        font-size: 23px;
      }


      .weekday-list label {
        min-width: 48px;

        padding:
          7px 8px;
      }


      .weekday-list input {
        margin-right: 4px;
      }


      #results {
        padding:
          30px 15px 45px;
      }

    }

  </style>
</head>


<body>

  <div class="page">


    <!-- ==================================================
         緑の横帯
         ================================================== -->

    <div class="green-band"></div>


    <main>


      <!-- ==================================================
           ようこそ
           ================================================== -->

      <h1 class="welcome">
        きっぷゴーへようこそ！
      </h1>


      <!-- ==================================================
           検索パネル
           ================================================== -->

      <section class="search-panel">


        <h2 class="search-title">
          （きっぷの絞り込み）
        </h2>


        <!-- エリア・社局 -->

        <div class="search-row">


          <!-- エリア -->

          <div class="form-group">

            <label for="area">
              エリア
            </label>


            <select id="area">

              <option value="">
                指定なし
              </option>

              <option value="北海道">
                北海道
              </option>

              <option value="東北">
                東北
              </option>

              <option value="関東甲信">
                関東甲信
              </option>

              <option value="北陸">
                北陸
              </option>

              <option value="東海4県">
                東海4県
              </option>

              <option value="関西">
                関西
              </option>

              <option value="中国">
                中国
              </option>

              <option value="四国">
                四国
              </option>

              <option value="九州・沖縄">
                九州・沖縄
              </option>

            </select>

          </div>


          <!-- 社局 -->

          <div class="form-group">

            <label for="company">
              社局名
            </label>


            <select id="company">

              <option value="">
                指定なし
              </option>

            </select>

          </div>

        </div>


        <!-- 種類・媒体 -->

        <div class="search-row">


          <!-- きっぷの種類 -->

          <div class="form-group">

            <label for="ticketType">
              きっぷの種類
            </label>


            <select id="ticketType">

              <option value="">
                指定なし
              </option>

              <option value="回数券">
                回数券
              </option>

              <option value="フリーパス">
                フリーパス
              </option>

              <option value="往復">
                往復
              </option>

            </select>

          </div>


          <!-- 媒体 -->

          <div class="form-group">

            <label for="media">
              媒体
            </label>


            <select id="media">

              <option value="">
                指定なし
              </option>

              <option value="紙">
                紙
              </option>

              <option value="デジタル">
                デジタル
              </option>

            </select>

          </div>

        </div>


        <!-- ==================================================
             曜日
             ================================================== -->

        <div class="weekday-area">


          <div class="weekday-title">
            利用できる曜日
          </div>


          <div class="weekday-list">


            <!-- 月 -->

            <label class="weekday-normal">

              <input
                type="checkbox"
                value="月"
              >

              月

            </label>


            <!-- 火 -->

            <label class="weekday-normal">

              <input
                type="checkbox"
                value="火"
              >

              火

            </label>


            <!-- 水 -->

            <label class="weekday-normal">

              <input
                type="checkbox"
                value="水"
              >

              水

            </label>


            <!-- 木 -->

            <label class="weekday-normal">

              <input
                type="checkbox"
                value="木"
              >

              木

            </label>


            <!-- 金 -->

            <label class="weekday-normal">

              <input
                type="checkbox"
                value="金"
              >

              金

            </label>


            <!-- 土 -->

            <label class="weekday-saturday">

              <input
                type="checkbox"
                value="土"
              >

              土

            </label>


            <!-- 日 -->

            <label class="weekday-sunday">

              <input
                type="checkbox"
                value="日"
              >

              日

            </label>


            <!-- 祝 -->

            <label class="weekday-holiday">

              <input
                type="checkbox"
                value="祝"
              >

              祝

            </label>


          </div>

        </div>


        <!-- ==================================================
             検索ボタン
             ================================================== -->

        <div class="search-button-area">

          <button
            type="button"
            class="search-button"
            id="searchButton"
            aria-label="検索"
          ></button>

        </div>


      </section>


      <!-- ==================================================
           検索結果
           ================================================== -->

      <section id="results">


        <h2>
          検索結果
        </h2>


        <div
          id="resultCount"
          class="result-count"
        ></div>


        <div id="resultList"></div>


      </section>


    </main>

  </div>



  <script>


    /* ==================================================
       エリア → 社局
       ================================================== */

    const companiesByArea = {

      "北海道": [
        "JR北海道"
      ],

      "東北": [
        "JR東日本",
        "仙台市交通局"
      ],

      "関東甲信": [
        "JR東日本",
        "東武",
        "西武",
        "京成",
        "小田急",
        "東急",
        "京王",
        "東京メトロ",
        "都営地下鉄"
      ],

      "北陸": [
        "JR西日本",
        "IRいしかわ鉄道",
        "あいの風とやま鉄道",
        "ハピラインふくい"
      ],

      "東海4県": [
        "JR東海",
        "名古屋鉄道",
        "近鉄",
        "名古屋市交通局",
        "静岡鉄道",
        "伊勢鉄道"
      ],

      "関西": [
        "JR西日本",
        "近鉄",
        "阪急",
        "阪神",
        "南海",
        "京阪",
        "大阪メトロ",
        "山陽電鉄"
      ],

      "中国": [
        "JR西日本",
        "一畑電車",
        "広島電鉄"
      ],

      "四国": [
        "JR四国",
        "ことでん",
        "伊予鉄道",
        "とさでん交通"
      ],

      "九州・沖縄": [
        "JR九州",
        "西日本鉄道",
        "福岡市地下鉄",
        "沖縄都市モノレール"
      ]

    };


    /* ==================================================
       HTML要素
       ================================================== */

    const areaSelect =
      document.getElementById("area");

    const companySelect =
      document.getElementById("company");

    const searchButton =
      document.getElementById("searchButton");

    const results =
      document.getElementById("results");

    const resultCount =
      document.getElementById("resultCount");

    const resultList =
      document.getElementById("resultList");


    /* ==================================================
       きっぷデータ
       tickets.jsonから読み込む
       ================================================== */

    let tickets = [];


    async function loadTickets() {

      try {

        const response =
          await fetch("./data/tickets.json");


        if (!response.ok) {

          throw new Error(
            "tickets.jsonを読み込めませんでした"
          );

        }


        const data =
          await response.json();


        tickets =
          data.tickets || [];


      } catch (error) {

        console.error(error);


        resultList.innerHTML = `

          <div class="data-error">

            きっぷデータを読み込めませんでした。

            <br><br>

            <strong>
              data/tickets.json
            </strong>

            が正しく配置されているか確認してください。

          </div>

        `;


        results.style.display =
          "block";

      }

    }


    /* ==================================================
       エリア変更
       ================================================== */

    areaSelect.addEventListener(
      "change",
      function() {


        const selectedArea =
          this.value;


        companySelect.innerHTML =
          "";


        const noneOption =
          document.createElement("option");


        noneOption.value = "";


        noneOption.textContent =
          "指定なし";


        companySelect.appendChild(
          noneOption
        );


        /*
         * エリア未指定
         * → 全社局を表示
         */

        if (selectedArea === "") {


          const allCompanies =
            new Set();


          Object.values(
            companiesByArea
          ).forEach(
            companies => {

              companies.forEach(
                company => {

                  allCompanies.add(
                    company
                  );

                }
              );

            }
          );


          [...allCompanies]
            .sort()
            .forEach(
              company => {


                const option =
                  document.createElement(
                    "option"
                  );


                option.value =
                  company;


                option.textContent =
                  company;


                companySelect.appendChild(
                  option
                );

              }
            );


          return;

        }


        /*
         * エリア指定あり
         */

        const companies =
          companiesByArea[
            selectedArea
          ] || [];


        companies.forEach(
          company => {


            const option =
              document.createElement(
                "option"
              );


            option.value =
              company;


            option.textContent =
              company;


            companySelect.appendChild(
              option
            );

          }
        );

      }
    );


    /* ==================================================
       検索ボタン
       ================================================== */

    searchButton.addEventListener(
      "click",
      searchTickets
    );


    /* ==================================================
       検索処理
       ================================================== */

    function searchTickets() {


      const area =
        areaSelect.value;


      const company =
        companySelect.value;


      const ticketType =
        document.getElementById(
          "ticketType"
        ).value;


      const media =
        document.getElementById(
          "media"
        ).value;


      /*
       * 選択された曜日
       */

      const selectedWeekdays =
        [
          ...document.querySelectorAll(
            ".weekday-list input:checked"
          )
        ].map(
          input => input.value
        );


      /*
       * きっぷを絞り込む
       */

      const filteredTickets =
        tickets.filter(
          ticket => {


            /*
             * エリア
             */

            if (
              area !== "" &&
              !ticket.areas.includes(
                area
              )
            ) {

              return false;

            }


            /*
             * 社局
             */

            if (
              company !== "" &&
              !ticket.companies.includes(
                company
              )
            ) {

              return false;

            }


            /*
             * きっぷの種類
             */

            if (
              ticketType !== "" &&
              ticket.type !== ticketType
            ) {

              return false;

            }


            /*
             * 媒体
             */

            if (
              media !== "" &&
              ticket.medium !== media
            ) {

              return false;

            }


            /*
             * 曜日
             *
             * 選択した曜日を
             * すべて満たす必要がある
             */

            if (
              selectedWeekdays.length > 0
            ) {


              const matches =
                selectedWeekdays.every(
                  day =>
                    ticket.weekdays.includes(
                      day
                    )
                );


              if (!matches) {

                return false;

              }

            }


            return true;

          }
        );


      /* ==================================================
         結果を表示
         ================================================== */

      results.style.display =
        "block";


      resultCount.textContent =
        `${filteredTickets.length}件のきっぷが見つかりました`;


      resultList.innerHTML =
        "";


      /*
       * 0件
       */

      if (
        filteredTickets.length === 0
      ) {


        resultList.innerHTML = `

          <div class="no-result">

            条件に一致するきっぷはありませんでした。

          </div>

        `;


        return;

      }


      /* ==================================================
         きっぷカードを作成
         ================================================== */

      filteredTickets.forEach(
        ticket => {


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "ticket-card";


          /*
           * 社局タグ
           */

          const companyTags =
            ticket.companies
              .map(
                company => `

                  <span
                    class="ticket-tag company-tag"
                  >
                    ${company}
                  </span>

                `
              )
              .join("");


          /*
           * 曜日
           */

          const weekdayText =
            ticket.weekdays.join("・");


          /*
           * 価格
           */

          const priceText =
            ticket.price &&
            ticket.price.adult != null

              ? `¥${ticket.price.adult.toLocaleString()}`

              : "価格情報なし";


          /*
           * カードHTML
           */

          card.innerHTML = `

            <div class="ticket-tags">

              ${companyTags}

              <span
                class="ticket-tag type-tag"
              >
                ${ticket.type}
              </span>

              <span
                class="ticket-tag weekday-tag"
              >
                ${weekdayText}
              </span>

            </div>


            <div class="ticket-title-row">

              <div class="ticket-name">
                ${ticket.name}
              </div>

              <div class="ticket-price">
                ${priceText}
              </div>

            </div>


            <div class="ticket-description">

              ${ticket.description}

            </div>


            <div class="ticket-details">

              媒体：
              ${ticket.medium}

              <br>

              利用エリア：
              ${ticket.usageArea}

            </div>


            <a
              class="official-link"
              href="${ticket.officialUrl}"
              target="_blank"
              rel="noopener noreferrer"
            >

              &gt;&gt;公式サイトへ

            </a>

          `;


          resultList.appendChild(
            card
          );

        }
      );

    }


    /* ==================================================
       ページ読み込み時
       ================================================== */

    loadTickets();

  </script>

</body>
</html>
