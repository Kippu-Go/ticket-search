<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- BIZ UDPGothic -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <title>きっぷゴー</title>


  <style>

    /* ==================================================
       基本設定
       ================================================== */

    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;

      font-family:
        "BIZ UDPGothic",
        sans-serif;

      color: #111;

      background: #ffffff;
    }


    /* ==================================================
       トップエリア
       ================================================== */

    .top-area {

      position: relative;

      width: 100%;

      min-height: 950px;

      overflow: hidden;

      background:
        linear-gradient(
          to bottom,

          #baf4df 0%,
          #baf4df 43%,

          #62c45d 43%,
          #62c45d 54%,

          #baf4df 54%,
          #baf4df 70%,

          #ffffff 70%,
          #ffffff 100%
        );
    }


    /* ==================================================
       メイン
       ================================================== */

    main {

      position: relative;

      z-index: 2;

      width:
        min(1100px, 100%);

      margin:
        0 auto;

      padding:
        90px 30px 100px;
    }


    /* ==================================================
       ようこそ
       ================================================== */

    .welcome {

      margin:
        0 0 105px;

      text-align: center;

      font-size:
        clamp(40px, 5vw, 64px);

      font-weight: 400;

      line-height: 1.4;
    }


    /* ==================================================
       検索パネル
       ================================================== */

    .search-panel {

      width:
        min(1000px, 100%);

      margin:
        0 auto;

      padding:
        55px 65px 60px;

      background:
        #ffffff;

      border:
        3px solid #111;

      border-radius:
        42px;

      box-shadow:
        0 2px 0 rgba(0, 0, 0, 0.05);
    }


    /* ==================================================
       検索タイトル
       ================================================== */

    .search-title {

      margin:
        0 0 48px;

      text-align:
        center;

      font-size:
        clamp(28px, 4vw, 42px);

      font-weight:
        700;

      line-height:
        1.4;
    }


    /* ==================================================
       検索項目
       ================================================== */

    .search-row {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        24px;

      margin-bottom:
        24px;
    }


    .form-group {

      display:
        flex;

      flex-direction:
        column;

      gap:
        9px;
    }


    .form-group label {

      font-size:
        17px;

      font-weight:
        700;
    }


    /* ==================================================
       セレクトボックス
       ================================================== */

    select {

      width:
        100%;

      min-height:
        58px;

      padding:
        10px 45px 10px 16px;

      border:
        2px solid #333;

      border-radius:
        10px;

      background:
        #ffffff;

      color:
        #111;

      font-family:
        "BIZ UDPGothic",
        sans-serif;

      font-size:
        17px;

      cursor:
        pointer;
    }


    select:focus {

      outline:
        3px solid
        rgba(22, 119, 210, 0.25);

      border-color:
        #1677d2;
    }


    /* ==================================================
       曜日
       ================================================== */

    .weekday-area {

      margin-top:
        35px;
    }


    .weekday-title {

      margin-bottom:
        18px;

      text-align:
        center;

      font-size:
        20px;

      font-weight:
        700;
    }


    .weekday-list {

      display:
        flex;

      justify-content:
        center;

      flex-wrap:
        wrap;

      gap:
        10px;
    }


    .weekday-list label {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      min-width:
        65px;

      min-height:
        52px;

      padding:
        8px 13px;

      background:
        #ffffff;

      border:
        2px solid #333;

      border-radius:
        9px;

      font-size:
        17px;

      font-weight:
        700;

      cursor:
        pointer;

      user-select:
        none;

      transition:
        background 0.15s,
        transform 0.15s;
    }


    .weekday-list label:hover {

      background:
        #f2f2f2;

      transform:
        translateY(-1px);
    }


    .weekday-list input {

      width:
        17px;

      height:
        17px;

      margin:
        0 7px 0 0;

      cursor:
        pointer;
    }


    /* 月〜金 */

    .weekday-normal {

      color:
        #111 !important;
    }


    /* 土曜日 */

    .weekday-saturday {

      color:
        #1677d2 !important;
    }


    /* 日曜日 */

    .weekday-sunday {

      color:
        #e53935 !important;
    }


    /* 祝日 */

    .weekday-holiday {

      color:
        #e53935 !important;
    }


    /* ==================================================
       検索ボタン
       ================================================== */

    .search-button-area {

      display:
        flex;

      justify-content:
        center;

      margin-top:
        42px;
    }


    .search-button {

      position:
        relative;

      width:
        76px;

      height:
        76px;

      padding:
        0;

      border:
        none;

      border-radius:
        50%;

      background:
        #1677d2;

      cursor:
        pointer;

      overflow:
        hidden;

      transition:
        transform 0.15s,
        background 0.15s;
    }


    .search-button:hover {

      background:
        #0f62b0;

      transform:
        scale(1.05);
    }


    .search-button:active {

      transform:
        scale(0.97);
    }


    /* ==================================================
       虫めがね
       ================================================== */

    .search-button::before {

      content:
        "";

      position:
        absolute;

      width:
        25px;

      height:
        25px;

      left:
        20px;

      top:
        18px;

      border:
        4px solid #ffffff;

      border-radius:
        50%;
    }


    .search-button::after {

      content:
        "";

      position:
        absolute;

      width:
        17px;

      height:
        4px;

      left:
        42px;

      top:
        43px;

      background:
        #ffffff;

      border-radius:
        4px;

      transform:
        rotate(45deg);

      transform-origin:
        left center;
    }


    /* ==================================================
       検索結果
       ================================================== */

    #results {

      display:
        none;

      width:
        min(1000px, 100%);

      margin:
        80px auto 0;

      padding:
        0 20px 100px;

      background:
        #ffffff;
    }


    #results h2 {

      margin:
        0 0 25px;

      text-align:
        center;

      font-size:
        34px;
    }


    .result-count {

      margin-bottom:
        20px;

      font-size:
        18px;

      font-weight:
        700;
    }


    /* ==================================================
       きっぷカード
       ================================================== */

    .ticket-card {

      margin-bottom:
        28px;

      padding:
        38px 45px;

      background:
        #ffffff;

      border:
        3px solid #111;

      border-radius:
        32px;

      box-shadow:
        0 4px 10px
        rgba(0, 0, 0, 0.05);
    }


    /* ==================================================
       タグ
       ================================================== */

    .ticket-tags {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        10px;

      margin-bottom:
        28px;
    }


    .ticket-tag {

      display:
        inline-block;

      padding:
        10px 15px;

      border-radius:
        10px;

      color:
        #ffffff;

      font-size:
        16px;

      font-weight:
        700;
    }


    .company-tag {

      background:
        #f28c00;
    }


    .company-tag:nth-child(2) {

      background:
        #315bea;
    }


    .company-tag:nth-child(3) {

      background:
        #7b55d9;
    }


    .type-tag {

      background:
        #62c45d;
    }


    .weekday-tag {

      background:
        #e85a4f;
    }


    /* ==================================================
       きっぷ名・価格
       ================================================== */

    .ticket-title-row {

      display:
        flex;

      align-items:
        baseline;

      flex-wrap:
        wrap;

      gap:
        20px;

      margin-bottom:
        25px;
    }


    .ticket-name {

      font-size:
        clamp(30px, 5vw, 52px);

      font-weight:
        700;

      line-height:
        1.3;
    }


    .ticket-price {

      font-size:
        30px;

      font-weight:
        700;

      white-space:
        nowrap;
    }


    /* ==================================================
       説明
       ================================================== */

    .ticket-description {

      margin-bottom:
        25px;

      font-size:
        18px;

      line-height:
        1.8;
    }


    /* ==================================================
       詳細
       ================================================== */

    .ticket-details {

      margin-bottom:
        22px;

      color:
        #444;

      font-size:
        15px;

      line-height:
        1.8;
    }


    /* ==================================================
       公式サイト
       ================================================== */

    .official-link {

      color:
        #1677d2;

      font-size:
        17px;

      font-weight:
        700;

      text-decoration:
        underline;
    }


    .official-link:hover {

      color:
        #0f62b0;
    }


    /* ==================================================
       検索結果なし
       ================================================== */

    .no-result {

      padding:
        40px;

      background:
        #ffffff;

      border:
        3px solid #111;

      border-radius:
        25px;

      text-align:
        center;

      font-size:
        18px;
    }


    /* ==================================================
       データ読み込みエラー
       ================================================== */

    .data-error {

      padding:
        35px 25px;

      background:
        #ffffff;

      border:
        3px solid #d33;

      border-radius:
        20px;

      color:
        #b00000;

      text-align:
        center;

      font-size:
        17px;

      line-height:
        1.9;
    }


    /* ==================================================
       横画面
       ================================================== */

    @media (orientation: landscape) {

      .top-area {

        min-height:
          900px;

        background:
          linear-gradient(
            to bottom,

            #baf4df 0%,
            #baf4df 43%,

            #62c45d 43%,
            #62c45d 54%,

            #baf4df 54%,
            #baf4df 70%,

            #ffffff 70%,
            #ffffff 100%
          );
      }


      main {

        padding-top:
          90px;
      }


      .welcome {

        margin-bottom:
          105px;
      }

    }


    /* ==================================================
       タブレット・スマホ
       ================================================== */

    @media (max-width: 700px) {

      .top-area {

        min-height:
          950px;

        background:
          linear-gradient(
            to bottom,

            #baf4df 0%,
            #baf4df 39%,

            #62c45d 39%,
            #62c45d 50%,

            #baf4df 50%,
            #baf4df 68%,

            #ffffff 68%,
            #ffffff 100%
          );
      }


      main {

        padding:
          60px 15px 90px;
      }


      .welcome {

        margin-bottom:
          70px;

        font-size:
          35px;
      }


      .search-panel {

        padding:
          35px 20px 40px;

        border-radius:
          28px;
      }


      .search-title {

        margin-bottom:
          32px;

        font-size:
          27px;
      }


      .search-row {

        grid-template-columns:
          1fr;

        gap:
          18px;

        margin-bottom:
          18px;
      }


      .weekday-area {

        margin-top:
          25px;
      }


      .weekday-list {

        gap:
          7px;
      }


      .weekday-list label {

        min-width:
          55px;

        min-height:
          48px;

        font-size:
          15px;
      }


      .search-button-area {

        margin-top:
          32px;
      }


      .search-button {

        width:
          68px;

        height:
          68px;
      }


      .search-button::before {

        width:
          22px;

        height:
          22px;

        left:
          18px;

        top:
          17px;
      }


      .search-button::after {

        width:
          16px;

        left:
          39px;

        top:
          41px;
      }


      #results {

        width:
          100%;

        margin-top:
          60px;

        padding:
          0 15px 80px;
      }


      .ticket-card {

        padding:
          25px 20px;

        border-radius:
          25px;
      }

    }


    /* ==================================================
       小さいスマホ
       ================================================== */

    @media (max-width: 420px) {

      .welcome {

        font-size:
          29px;
      }


      .search-title {

        font-size:
          23px;
      }


      .weekday-list label {

        min-width:
          48px;

        padding:
          7px 8px;
      }


      .weekday-list input {

        margin-right:
          4px;
      }

    }

  </style>

</head>


<body>


  <!-- ==================================================
       トップエリア
       ================================================== -->

  <div class="top-area">


    <main>


      <!-- ==================================================
           ようこそ
           ================================================== -->

      <h1 class="welcome">
        きっぷゴーへようこそ！
      </h1>


      <!-- ==================================================
           検索パネル
           ================================================== -->

      <section class="search-panel">


        <h2 class="search-title">
          （きっぷの絞り込み）
        </h2>


        <!-- ==================================================
             エリア・社局
             ================================================== -->

        <div class="search-row">


          <div class="form-group">

            <label for="area">
              エリア
            </label>


            <select id="area">

              <option value="">
                指定なし
              </option>

              <option value="北海道">
                北海道
              </option>

              <option value="東北">
                東北
              </option>

              <option value="関東甲信">
                関東甲信
              </option>

              <option value="北陸">
                北陸
              </option>

              <option value="東海4県">
                東海4県
              </option>

              <option value="関西">
                関西
              </option>

              <option value="中国">
                中国
              </option>

              <option value="四国">
                四国
              </option>

              <option value="九州・沖縄">
                九州・沖縄
              </option>

            </select>

          </div>


          <div class="form-group">

            <label for="company">
              社局名
            </label>


            <select id="company">

              <option value="">
                指定なし
              </option>

            </select>

          </div>


        </div>


        <!-- ==================================================
             種類・媒体
             ================================================== -->

        <div class="search-row">


          <div class="form-group">

            <label for="ticketType">
              きっぷの種類
            </label>


            <select id="ticketType">

              <option value="">
                指定なし
              </option>

              <option value="回数券">
                回数券
              </option>

              <option value="フリーパス">
                フリーパス
              </option>

              <option value="往復">
                往復
              </option>

            </select>

          </div>


          <div class="form-group">

            <label for="media">
              媒体
            </label>


            <select id="media">

              <option value="">
                指定なし
              </option>

              <option value="紙">
                紙
              </option>

              <option value="デジタル">
                デジタル
              </option>

            </select>

          </div>


        </div>


        <!-- ==================================================
             曜日
             ================================================== -->

        <div class="weekday-area">


          <div class="weekday-title">
            利用できる曜日
          </div>


          <div class="weekday-list">


            <label class="weekday-normal">

              <input
                type="checkbox"
                value="月"
              >

              月

            </label>


            <label class="weekday-normal">

              <input
                type="checkbox"
                value="火"
              >

              火

            </label>


            <label class="weekday-normal">

              <input
                type="checkbox"
                value="水"
              >

              水

            </label>


            <label class="weekday-normal">

              <input
                type="checkbox"
                value="木"
              >

              木

            </label>


            <label class="weekday-normal">

              <input
                type="checkbox"
                value="金"
              >

              金

            </label>


            <label class="weekday-saturday">

              <input
                type="checkbox"
                value="土"
              >

              土

            </label>


            <label class="weekday-sunday">

              <input
                type="checkbox"
                value="日"
              >

              日

            </label>


            <label class="weekday-holiday">

              <input
                type="checkbox"
                value="祝"
              >

              祝

            </label>


          </div>

        </div>


        <!-- ==================================================
             検索ボタン
             ================================================== -->

        <div class="search-button-area">

          <button
            type="button"
            class="search-button"
            id="searchButton"
            aria-label="検索"
          ></button>

        </div>


      </section>


    </main>


  </div>


  <!-- ==================================================
       検索結果
       ================================================== -->

  <section id="results">


    <h2>
      検索結果
    </h2>


    <div
      id="resultCount"
      class="result-count"
    ></div>


    <div id="resultList"></div>


  </section>



  <script>


    /* ==================================================
       エリア → 社局
       ================================================== */

    const companiesByArea = {

      "北海道": [
        "JR北海道"
      ],

      "東北": [
        "JR東日本",
        "仙台市交通局"
      ],

      "関東甲信": [
        "JR東日本",
        "東武",
        "西武",
        "京成",
        "小田急",
        "東急",
        "京王",
        "東京メトロ",
        "都営地下鉄"
      ],

      "北陸": [
        "JR西日本",
        "IRいしかわ鉄道",
        "あいの風とやま鉄道",
        "ハピラインふくい"
      ],

      "東海4県": [
        "JR東海",
        "名古屋鉄道",
        "近鉄",
        "名古屋市交通局",
        "静岡鉄道",
        "伊勢鉄道"
      ],

      "関西": [
        "JR西日本",
        "近鉄",
        "阪急",
        "阪神",
        "南海",
        "京阪",
        "大阪メトロ",
        "山陽電鉄"
      ],

      "中国": [
        "JR西日本",
        "一畑電車",
        "広島電鉄"
      ],

      "四国": [
        "JR四国",
        "ことでん",
        "伊予鉄道",
        "とさでん交通"
      ],

      "九州・沖縄": [
        "JR九州",
        "西日本鉄道",
        "福岡市地下鉄",
        "沖縄都市モノレール"
      ]

    };


    /* ==================================================
       HTML要素
       ================================================== */

    const areaSelect =
      document.getElementById("area");


    const companySelect =
      document.getElementById("company");


    const searchButton =
      document.getElementById("searchButton");


    const results =
      document.getElementById("results");


    const resultCount =
      document.getElementById("resultCount");


    const resultList =
      document.getElementById("resultList");


    /* ==================================================
       きっぷデータ
       ================================================== */

    let tickets = [];


    /*
     * データ読み込みに成功したか
     */

    let ticketsLoaded = false;


    /*
     * データ読み込み
     *
     * ページを開いた時点では
     * エラーを画面に表示しない。
     */

    async function loadTickets() {

      try {

        const response =
          await fetch(
            "./data/tickets.json"
          );


        if (!response.ok) {

          throw new Error(
            "tickets.jsonの読み込みに失敗しました"
          );

        }


        const data =
          await response.json();


        tickets =
          Array.isArray(data.tickets)
            ? data.tickets
            : [];


        ticketsLoaded = true;


      } catch (error) {

        console.error(
          "きっぷデータの読み込みに失敗しました:",
          error
        );


        ticketsLoaded = false;

      }

    }


    /* ==================================================
       エリア変更
       ================================================== */

    areaSelect.addEventListener(
      "change",
      function () {


        const selectedArea =
          this.value;


        companySelect.innerHTML =
          "";


        const noneOption =
          document.createElement(
            "option"
          );


        noneOption.value =
          "";


        noneOption.textContent =
          "指定なし";


        companySelect.appendChild(
          noneOption
        );


        /*
         * エリア未指定
         * → 全社局
         */

        if (
          selectedArea === ""
        ) {


          const allCompanies =
            new Set();


          Object.values(
            companiesByArea
          ).forEach(
            companies => {

              companies.forEach(
                company => {

                  allCompanies.add(
                    company
                  );

                }
              );

            }
          );


          [
            ...allCompanies
          ]
            .sort()
            .forEach(
              company => {


                const option =
                  document.createElement(
                    "option"
                  );


                option.value =
                  company;


                option.textContent =
                  company;


                companySelect.appendChild(
                  option
                );

              }
            );


          return;

        }


        /*
         * エリア指定あり
         */

        const companies =
          companiesByArea[
            selectedArea
          ] || [];


        companies.forEach(
          company => {


            const option =
              document.createElement(
                "option"
              );


            option.value =
              company;


            option.textContent =
              company;


            companySelect.appendChild(
              option
            );

          }
        );

      }
    );


    /* ==================================================
       検索
       ================================================== */

    searchButton.addEventListener(
      "click",
      searchTickets
    );


    async function searchTickets() {


      /*
       * 万が一まだ読み込み中なら
       * 読み込み完了を待つ
       */

      if (!ticketsLoaded) {

        await loadTickets();

      }


      /*
       * データを読み込めなかった場合
       *
       * このタイミングで初めて
       * エラーメッセージを表示する
       */

      if (!ticketsLoaded) {

        results.style.display =
          "block";


        resultCount.textContent =
          "";


        resultList.innerHTML = `

          <div class="data-error">

            きっぷデータを読み込めませんでした。

            <br>

            ネットワーク接続を確認してください。

            <br>

            何度も表示される場合は、運営にお問い合わせください。

          </div>

        `;


        results.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });


        return;

      }


      /* ==================================================
         選択条件
         ================================================== */

      const area =
        areaSelect.value;


      const company =
        companySelect.value;


      const ticketType =
        document.getElementById(
          "ticketType"
        ).value;


      const media =
        document.getElementById(
          "media"
        ).value;


      /*
       * 選択された曜日
       */

      const selectedWeekdays =
        [
          ...document.querySelectorAll(
            ".weekday-list input:checked"
          )
        ].map(
          input => input.value
        );


      /* ==================================================
         きっぷを絞り込む
         ================================================== */

      const filteredTickets =
        tickets.filter(
          ticket => {


            /*
             * エリア
             */

            if (
              area !== "" &&
              !ticket.areas.includes(
                area
              )
            ) {

              return false;

            }


            /*
             * 社局
             */

            if (
              company !== "" &&
              !ticket.companies.includes(
                company
              )
            ) {

              return false;

            }


            /*
             * 種類
             */

            if (
              ticketType !== "" &&
              ticket.type !== ticketType
            ) {

              return false;

            }


            /*
             * 媒体
             */

            if (
              media !== "" &&
              ticket.medium !== media
            ) {

              return false;

            }


            /*
             * 曜日
             *
             * 選択した曜日を
             * すべて満たすきっぷだけ表示
             */

            if (
              selectedWeekdays.length > 0
            ) {


              const matches =
                selectedWeekdays.every(
                  day =>
                    ticket.weekdays.includes(
                      day
                    )
                );


              if (!matches) {

                return false;

              }

            }


            return true;

          }
        );


      /* ==================================================
         検索結果表示
         ================================================== */

      results.style.display =
        "block";


      resultCount.textContent =
        `${filteredTickets.length}件のきっぷが見つかりました`;


      resultList.innerHTML =
        "";


      /* ==================================================
         0件
         ================================================== */

      if (
        filteredTickets.length === 0
      ) {


        resultList.innerHTML = `

          <div class="no-result">

            条件に一致するきっぷはありませんでした。

          </div>

        `;


        results.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });


        return;

      }


      /* ==================================================
         きっぷカード
         ================================================== */

      filteredTickets.forEach(
        ticket => {


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "ticket-card";


          /*
           * 社局タグ
           */

          const companyTags =
            ticket.companies
              .map(
                company => `

                  <span
                    class="ticket-tag company-tag"
                  >
                    ${company}
                  </span>

                `
              )
              .join("");


          /*
           * 曜日
           */

          const weekdayText =
            ticket.weekdays.join("・");


          /*
           * 価格
           */

          const priceText =
            ticket.price &&
            ticket.price.adult != null

              ? `¥${ticket.price.adult.toLocaleString()}`

              : "価格情報なし";


          /*
           * カード
           */

          card.innerHTML = `

            <div class="ticket-tags">

              ${companyTags}

              <span
                class="ticket-tag type-tag"
              >
                ${ticket.type}
              </span>

              <span
                class="ticket-tag weekday-tag"
              >
                ${weekdayText}
              </span>

            </div>


            <div class="ticket-title-row">

              <div class="ticket-name">
                ${ticket.name}
              </div>


              <div class="ticket-price">
                ${priceText}
              </div>

            </div>


            <div class="ticket-description">

              ${ticket.description}

            </div>


            <div class="ticket-details">

              媒体：
              ${ticket.medium}

              <br>

              利用エリア：
              ${ticket.usageArea}

            </div>


            <a
              class="official-link"
              href="${ticket.officialUrl}"
              target="_blank"
              rel="noopener noreferrer"
            >

              &gt;&gt;公式サイトへ

            </a>

          `;


          resultList.appendChild(
            card
          );

        }
      );


      /* ==================================================
         検索結果まで移動
         ================================================== */

      results.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }


    /* ==================================================
       初期読み込み
       ================================================== */

    loadTickets();


  </script>

</body>

</html>
